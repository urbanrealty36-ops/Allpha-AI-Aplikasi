name: Allpha GLB Asset Acquisition Audit
# Acquisition downloads up to the configured multi-GB limit. Keep it manual so
# ordinary source edits cannot unexpectedly re-download a large external collection.
on:
  workflow_dispatch:
    inputs:
      max_assets:
        description: "Maximum unique GLB URLs to process (default 1200)"
        required: true
        default: "1200"
      max_bytes:
        description: "Maximum downloaded bytes (default 3 GB)"
        required: true
        default: "3000000000"
permissions:
  contents: read
  actions: write
concurrency:
  group: allpha-glb-acquisition
  cancel-in-progress: false
jobs:
  acquire-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Acquire GLB assets from the seven approved repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_ASSETS: ${{ inputs.max_assets }}
          MAX_BYTES: ${{ inputs.max_bytes }}
        run: python tools/3d-assets/acquire_glb_assets.py --out allpha-glb-acquisition
      - name: Package downloaded assets and audit manifests
        if: always()
        run: |
          if [ -d allpha-glb-acquisition ]; then
            cd allpha-glb-acquisition
            zip -qr ../allpha-glb-acquisition.zip .
          fi
      - name: Upload audit and downloaded GLB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allpha-glb-acquisition-${{ github.run_number }}
          path: |
            allpha-glb-acquisition.zip
            allpha-glb-acquisition/manifest.csv
            allpha-glb-acquisition/summary.json
            allpha-glb-acquisition/errors.json
          if-no-files-found: warn
          retention-days: 14
