name: Capture Complete Reference UI Images

on:
  push:
    paths:
      - ".github/workflows/capture-complete-reference-ui-images.yml"
      - "docs/PHASES/ALLPHA_FIXED_PHASE_PLAN.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-reference-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout pinned reference UI repository
        uses: actions/checkout@v4
        with:
          repository: urbanrealty36-ops/Allpha-Front-End-UI-New
          ref: b6c9fc728d5d031a28b22fbbec9a546846900e87
          path: reference-ui
          fetch-depth: 1

      - name: Copy all image assets and verify source Git blobs
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil
          import subprocess

          source_root = pathlib.Path("reference-ui")
          commit = "b6c9fc728d5d031a28b22fbbec9a546846900e87"
          listing = subprocess.check_output(
              ["git", "-C", str(source_root), "ls-tree", "-rl", "--full-tree", "HEAD"],
              text=True,
          )
          image_exts = {".png", ".jpg", ".jpeg", ".webp", ".gif", ".svg", ".avif"}
          inventory = []
          for line in listing.splitlines():
              meta, source_path = line.split("\\t", 1)
              mode, kind, blob_sha, size_text = meta.split()
              path = pathlib.PurePosixPath(source_path)
              if kind != "blob" or path.suffix.lower() not in image_exts:
                  continue
              if not (source_path.startswith("public/assets/") or source_path.startswith("src/assets/images/")):
                  continue
              source_file = source_root / source_path
              data = source_file.read_bytes()
              size = len(data)
              actual_sha = subprocess.check_output(
                  ["git", "-C", str(source_root), "hash-object", str(source_file)],
                  text=True,
              ).strip()
              if size != int(size_text) or actual_sha != blob_sha:
                  raise SystemExit(f"Source integrity mismatch: {source_path}")
              if source_path.startswith("public/"):
                  target = pathlib.Path("apps/web") / source_path
              else:
                  target = pathlib.Path("apps/web/public/assets/reference-source") / source_path.removeprefix("src/assets/")
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source_file, target)
              inventory.append({
                  "source": source_path,
                  "target": target.as_posix(),
                  "bytes": size,
                  "git_blob_sha1": actual_sha,
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "source_commit": commit,
              })
              print(f"VERIFIED {source_path} -> {target.as_posix()} bytes={size} git_blob_sha1={actual_sha}")

          if not inventory:
              raise SystemExit("No image assets found; refusing empty capture.")
          manifest = pathlib.Path("docs/reference-ui-source/REFERENCE_IMAGE_ASSET_INVENTORY.json")
          manifest.parent.mkdir(parents=True, exist_ok=True)
          manifest.write_text(json.dumps({
              "reference_repository": "https://github.com/urbanrealty36-ops/Allpha-Front-End-UI-New",
              "source_commit": commit,
              "capture_count": len(inventory),
              "verification": "Every copied image matched the pinned source checkout's byte size and Git blob SHA-1; SHA-256 is recorded per target.",
              "assets": inventory,
          }, indent=2) + "\\n")
          print(f"Captured and verified {len(inventory)} reference images.")
          PY

      - name: Commit copied assets and inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/assets docs/reference-ui-source/REFERENCE_IMAGE_ASSET_INVENTORY.json
          if git diff --cached --quiet; then
            echo "All reference image assets already match the pinned source."
            exit 0
          fi
          git commit -m "chore(ui): capture all pinned reference image assets"
          git push origin HEAD:main
