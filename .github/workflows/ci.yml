name: Allpha Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "apps/api[dev]"
      - run: pytest apps/api/tests
      - name: Verify ENG-P04 ontology and Passion/Habit migrations on disposable PostgreSQL 17
        run: python apps/api/scripts/verify_eng_p04_interest_graph.py
      - name: Verify ENG-P05 Agent identity, Passport consent and ownership transfer on disposable PostgreSQL 17
        run: python apps/api/scripts/verify_eng_p05_agent_identity.py

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: apps/web
        run: npm install --no-audit --no-fund
      - working-directory: apps/web
        run: npm test
      - working-directory: apps/web
        run: npm run build

  native-client-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: apps/client
        run: npm install --no-audit --no-fund
      - working-directory: apps/client
        run: npm test
      - working-directory: apps/client
        run: npm run typecheck
      - working-directory: apps/client
        run: npx expo export --platform android

  super-admin-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: apps/super-admin
        run: npm install --no-audit --no-fund
      - working-directory: apps/super-admin
        run: npm test
      - working-directory: apps/super-admin
        run: npm run typecheck
      - working-directory: apps/super-admin
        run: npm run build
