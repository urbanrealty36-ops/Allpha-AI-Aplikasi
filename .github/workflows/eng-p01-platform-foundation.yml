name: Allpha Main Smoke Check

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/client/**"
      - "apps/super-admin/**"
      - ".github/workflows/eng-p01-platform-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-smoke:
    name: API smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test API
        working-directory: apps/api
        run: python -m pip install -e ".[dev]" && pytest -q

  web-smoke:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build web
        working-directory: apps/web
        run: npm install && npm run build
