name: ENG-P01 Platform Foundation

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/client/**"
      - "apps/super-admin/**"
      - "docker-compose.yml"
      - "docs/PHASES/ALLPHA_FIXED_PHASE_PLAN.md"
      - "docs/architecture/ADR-0001-native-client-expo.md"
      - ".github/workflows/eng-p01-platform-foundation.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Public client configuration shared by the four monorepo app surfaces.
# These are public URLs/keys only; never place service-role or provider secrets here.
env:
  ALLPHA_API_BASE_URL: https://allpha-api.up.railway.app
  NEXT_PUBLIC_API_BASE_URL: https://allpha-api.up.railway.app
  NEXT_PUBLIC_SUPABASE_URL: https://dvdziauyvuhcnqhrrvww.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Kc2veoWBTA_Plv-LBMfMqw_82bu43hg
  EXPO_PUBLIC_API_BASE_URL: https://allpha-api.up.railway.app
  EXPO_PUBLIC_SUPABASE_URL: https://dvdziauyvuhcnqhrrvww.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Kc2veoWBTA_Plv-LBMfMqw_82bu43hg
concurrency:
  group: eng-p01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test API
        working-directory: apps/api
        run: python -m pip install -e ".[dev]" && python -m compileall -q src tests scripts && pytest -q
      - name: Build Railway deployment image
        run: docker build --file apps/api/Dockerfile --tag allpha-api:ci apps/api
      - name: Validate three-service Compose topology
        run: docker compose config --quiet

  web-build:
    name: Existing Web typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run typecheck && npm run build
        working-directory: apps/web
      - name: Build Web container image
        run: docker build --file apps/web/Dockerfile --tag allpha-web:ci apps/web

  super-admin-build:
    name: Super Admin typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
        working-directory: apps/super-admin
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/super-admin
      - name: Build Super Admin container image
        # These non-routable public config values are compile-only CI inputs; never deployed to Production.
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://ci.invalid.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_build_only
          --file apps/super-admin/Dockerfile
          --tag allpha-super-admin:ci
          apps/super-admin

  native-android-build:
    name: Native Android prebuild and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm test
        working-directory: apps/client
      - run: npx expo prebuild --platform android --no-install && npx expo export --platform android
        working-directory: apps/client
      - name: Scan Android client export for privileged credentials
        working-directory: apps/client
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'SUPABASE_SERVICE_ROLE_KEY|service_role|sb_secret_[A-Za-z0-9_-]+' dist; then
            echo "Privileged Supabase credential pattern found in native client export."
            exit 1
          fi
      - run: ./gradlew assembleDebug
        working-directory: apps/client/android
      - name: Generate Android APK SHA-256 manifest
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS
        working-directory: apps/client/android
      - name: Upload Android debug APK evidence
        uses: actions/upload-artifact@v4
        with:
          name: allpha-eng-p01-android-debug-apk
          path: |
            apps/client/android/app/build/outputs/apk/debug/app-debug.apk
            apps/client/android/app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  native-ios-build:
    name: Native iOS prebuild and simulator build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm test
        working-directory: apps/client
      - run: npx expo prebuild --platform ios --no-install && npx expo export --platform ios
        working-directory: apps/client
      - name: Scan iOS client export for privileged credentials
        working-directory: apps/client
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'SUPABASE_SERVICE_ROLE_KEY|service_role|sb_secret_[A-Za-z0-9_-]+' dist; then
            echo "Privileged Supabase credential pattern found in native client export."
            exit 1
          fi
      - run: npx pod-install
        working-directory: apps/client
      - run: xcodebuild -workspace ios/Allpha.xcworkspace -scheme Allpha -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/client
      - name: Package iOS simulator app and generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          app_path="ios/build/Build/Products/Debug-iphonesimulator/Allpha.app"
          archive_path="ios/build/Allpha-ios-simulator.app.zip"
          test -d "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$archive_path"
          shasum -a 256 "$archive_path" > ios/build/SHA256SUMS
        working-directory: apps/client
      - name: Upload iOS simulator build evidence
        uses: actions/upload-artifact@v4
        with:
          name: allpha-eng-p01-ios-simulator-build
          path: |
            apps/client/ios/build/Allpha-ios-simulator.app.zip
            apps/client/ios/build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

