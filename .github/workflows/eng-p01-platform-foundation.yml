name: ENG-P01 Platform Foundation

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/client/**"
      - "apps/super-admin/**"
      - "docs/PHASES/ALLPHA_FIXED_PHASE_PLAN.md"
      - "docs/architecture/ADR-0001-native-client-expo.md"
      - ".github/workflows/eng-p01-platform-foundation.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Public client configuration shared by the four monorepo app surfaces.
# These are public URLs/keys only; never place service-role or provider secrets here.
env:
  ALLPHA_API_BASE_URL: https://allpha-api.up.railway.app
  NEXT_PUBLIC_API_BASE_URL: https://allpha-api.up.railway.app
  NEXT_PUBLIC_SUPABASE_URL: https://dvdziauyvuhcnqhrrvww.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Kc2veoWBTA_Plv-LBMfMqw_82bu43hg
  EXPO_PUBLIC_API_BASE_URL: https://allpha-api.up.railway.app
  EXPO_PUBLIC_SUPABASE_URL: https://dvdziauyvuhcnqhrrvww.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Kc2veoWBTA_Plv-LBMfMqw_82bu43hg
concurrency:
  group: eng-p01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test API
        working-directory: apps/api
        run: python -m pip install -e ".[dev]" && python -m compileall -q src tests scripts && pytest -q
      - name: Build Railway deployment image
        run: docker build --tag allpha-api:ci .

  web-build:
    name: Existing Web typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run typecheck && npm run build
        working-directory: apps/web

  super-admin-build:
    name: Super Admin typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
        working-directory: apps/super-admin
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/super-admin

  native-android-build:
    name: Native Android prebuild and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses || true
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm test
        working-directory: apps/client
      - run: npx expo prebuild --platform android --no-install && npx expo export --platform android
        working-directory: apps/client
      - name: Scan Android client export for privileged credentials
        working-directory: apps/client
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'SUPABASE_SERVICE_ROLE_KEY|service_role|sb_secret_[A-Za-z0-9_-]+' dist; then
            echo "Privileged Supabase credential pattern found in native client export."
            exit 1
          fi
      - run: ./gradlew assembleDebug
        working-directory: apps/client/android
      - name: Upload Android debug APK evidence
        uses: actions/upload-artifact@v4
        with:
          name: allpha-eng-p01-android-debug-apk
          path: apps/client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  native-ios-build:
    name: Native iOS prebuild and simulator build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm test
        working-directory: apps/client
      - run: npx expo prebuild --platform ios --no-install && npx expo export --platform ios
        working-directory: apps/client
      - name: Scan iOS client export for privileged credentials
        working-directory: apps/client
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'SUPABASE_SERVICE_ROLE_KEY|service_role|sb_secret_[A-Za-z0-9_-]+' dist; then
            echo "Privileged Supabase credential pattern found in native client export."
            exit 1
          fi
      - run: npx pod-install
        working-directory: apps/client
      - run: xcodebuild -workspace ios/Allpha.xcworkspace -scheme Allpha -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/client
      - name: Upload iOS simulator build evidence
        uses: actions/upload-artifact@v4
        with:
          name: allpha-eng-p01-ios-simulator-build
          path: apps/client/ios/build/Build/Products/Debug-iphonesimulator/Allpha.app
          if-no-files-found: warn
          retention-days: 14

  supabase-real-journey:
    name: Supabase real auth/profile/logout journey (configured environment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run real Supabase integration when dedicated test credentials are configured
        working-directory: apps/api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ALLPHA_API_BASE_URL: ${{ secrets.ALLPHA_API_BASE_URL }}
          ALLPHA_E2E_TEST_EMAIL: ${{ secrets.ALLPHA_E2E_TEST_EMAIL }}
          ALLPHA_E2E_TEST_PASSWORD: ${{ secrets.ALLPHA_E2E_TEST_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" || -z "$ALLPHA_API_BASE_URL" || -z "$ALLPHA_E2E_TEST_EMAIL" || -z "$ALLPHA_E2E_TEST_PASSWORD" ]]; then
            echo "::warning::Real Supabase journey not run: configure SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, ALLPHA_API_BASE_URL, ALLPHA_E2E_TEST_EMAIL and ALLPHA_E2E_TEST_PASSWORD as repository Actions secrets."
            exit 0
          fi
          python -m pip install --disable-pip-version-check httpx
          python scripts/verify_supabase_journey.py

  tenant-isolation-real-integration:
    name: ENG-P02 staging tenant-isolation integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cross-tenant checks only with a dedicated staging fixture
        working-directory: apps/api
        env:
          ALLPHA_ENVIRONMENT: staging
          SUPABASE_URL: ${{ secrets.ALLPHA_STAGING_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ALLPHA_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          ALLPHA_API_BASE_URL: ${{ secrets.ALLPHA_STAGING_API_BASE_URL }}
          ALLPHA_TENANT_A_EMAIL: ${{ secrets.ALLPHA_STAGING_TENANT_A_EMAIL }}
          ALLPHA_TENANT_A_PASSWORD: ${{ secrets.ALLPHA_STAGING_TENANT_A_PASSWORD }}
          ALLPHA_TENANT_B_EMAIL: ${{ secrets.ALLPHA_STAGING_TENANT_B_EMAIL }}
          ALLPHA_TENANT_B_PASSWORD: ${{ secrets.ALLPHA_STAGING_TENANT_B_PASSWORD }}
          ALLPHA_TENANT_A_ORG_ID: ${{ secrets.ALLPHA_STAGING_TENANT_A_ORG_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" || -z "$ALLPHA_API_BASE_URL" || -z "$ALLPHA_TENANT_A_EMAIL" || -z "$ALLPHA_TENANT_A_PASSWORD" || -z "$ALLPHA_TENANT_B_EMAIL" || -z "$ALLPHA_TENANT_B_PASSWORD" || -z "$ALLPHA_TENANT_A_ORG_ID" ]]; then
            echo "::warning::ENG-P02 real tenant isolation was not run. Configure the dedicated ALLPHA_STAGING_* repository secrets and pre-provisioned staging tenant fixture."
            exit 0
          fi
          python -m pip install --disable-pip-version-check httpx
          python scripts/verify_tenant_isolation.py
