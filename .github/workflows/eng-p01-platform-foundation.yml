name: ENG-P01 Platform Foundation

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/eng-p01-platform-foundation.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/eng-p01-platform-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eng-p01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API and test dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run API contract tests
        working-directory: apps/api
        run: pytest

  web-checks:
    name: Web lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install web dependencies
        run: npm install
      - name: Lint web
        run: npm run lint
      - name: Build web
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --project apps/api/pyproject.toml
      - name: Audit web dependencies
        working-directory: apps/web
        run: npm install && npm audit --audit-level=high
