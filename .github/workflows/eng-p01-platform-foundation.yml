name: ENG-P01 Platform Foundation

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/client/**"
      - "apps/super-admin/**"
      - "docs/PHASES/ALLPHA_FIXED_PHASE_PLAN.md"
      - "docs/architecture/ADR-0001-native-client-expo.md"
      - ".github/workflows/eng-p01-platform-foundation.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: eng-p01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test API
        working-directory: apps/api
        run: python -m pip install -e ".[dev]" && pytest -q

  web-build:
    name: Existing Web typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - run: npm run typecheck && npm run build
        working-directory: apps/web

  super-admin-build:
    name: Super Admin typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
        working-directory: apps/super-admin
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/super-admin

  native-android-build:
    name: Native Android prebuild and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --no-audit --no-fund && npm run typecheck && npm test
        working-directory: apps/client
      - run: npx expo prebuild --platform android --no-install && npx expo export --platform android
        working-directory: apps/client
      - run: ./gradlew assembleDebug
        working-directory: apps/client/android

  native-ios-build:
    name: Native iOS prebuild and simulator build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund && npm run typecheck && npm test
        working-directory: apps/client
      - run: npx expo prebuild --platform ios --no-install && npx expo export --platform ios
        working-directory: apps/client
      - run: npx pod-install
        working-directory: apps/client
      - run: xcodebuild -workspace ios/Allpha.xcworkspace -scheme Allpha -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/client
