name: ENG-P02 Verify Pre-Migration Backup Restore

on:
  workflow_run:
    workflows: ["ENG-P02 Create Pre-Migration Database Backup"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: eng-p02-backup-restore-verification
  cancel-in-progress: false

jobs:
  restore-backup-to-disposable-supabase-postgres:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKUP_RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
      - uses: actions/checkout@v4

      - name: Download the exact pre-migration backup artifact
        uses: actions/download-artifact@v4
        with:
          name: eng-p02-pre-migration-db-backup
          path: recovery-evidence
          run-id: ${{ env.BACKUP_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify artifact identity and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s recovery-evidence/allpha-p02-pre-migration.dump
          test -s recovery-evidence/restore-point-evidence.json
          actual_sha256="$(sha256sum recovery-evidence/allpha-p02-pre-migration.dump | awk '{print $1}')"
          export ACTUAL_BACKUP_SHA256="$actual_sha256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("recovery-evidence/restore-point-evidence.json").read_text())
          assert manifest["project_ref"] == "dvdziauyvuhcnqhrrvww"
          assert manifest["restore_tested"] is False
          assert manifest["database_migration_applied"] is False
          assert manifest["restore_executed"] is False
          assert manifest["sha256"] == os.environ["ACTUAL_BACKUP_SHA256"]
          print("Fresh backup artifact identity and checksum verified.")
          PY

      - name: Create an isolated Supabase restore workspace without project migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restore-workspace/supabase
          restore_db_port=$((54322 + BACKUP_RUN_ID % 1000))
          cat > restore-workspace/supabase/config.toml <<'TOML'
          project_id = "allpha-p02-restore-verification"

          [api]
          enabled = false

          [db]
          port = 54322
          major_version = 17

          [db.migrations]
          schema_paths = []
          TOML
          # Use a run-specific host port so overlapping recovery jobs cannot collide.
          sed -i "s/^port = 54322$/port = $restore_db_port/" restore-workspace/supabase/config.toml

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Start an isolated Supabase PostgreSQL 17 stack
        working-directory: restore-workspace
        shell: bash
        run: |
          set -euo pipefail
          supabase start

      - name: Resolve the Supabase PostgreSQL container and privileged restore role
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_allpha-p02-restore-verification' | head -n 1)"
          test -n "$db_container"
          role_state="$(docker exec -u postgres "$db_container" psql -U postgres -d postgres -Atc \
            "select rolcanlogin::text || '|' || rolsuper::text from pg_roles where rolname='supabase_admin'")"
          test "$role_state" = "true|true"
          echo "SUPABASE_DB_CONTAINER=$db_container" >> "$GITHUB_ENV"

      - name: Create a separate disposable restore database
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            createdb -U supabase_admin -O supabase_admin allpha_p02_restore_verification

      - name: Restore the full custom archive into the disposable database
        shell: bash
        run: |
          set -euo pipefail
          docker cp recovery-evidence/allpha-p02-pre-migration.dump \
            "$SUPABASE_DB_CONTAINER:/tmp/allpha-p02-pre-migration.dump"
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            pg_restore \
              --username=supabase_admin \
              --dbname=allpha_p02_restore_verification \
              --no-owner \
              --no-privileges \
              --exit-on-error \
              /tmp/allpha-p02-pre-migration.dump

      - name: Verify restored schema, RLS and ENG-P02 migration
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification \
              -v ON_ERROR_STOP=1 -Atc "
                select case when current_database()='allpha_p02_restore_verification' then 'database_identity=PASS' else 'database_identity=FAIL' end;
                select case when to_regclass('auth.users') is not null then 'auth_users=PASS' else 'auth_users=FAIL' end;
                select case when to_regclass('public.profiles') is not null then 'profiles=PASS' else 'profiles=FAIL' end;
                select case when to_regclass('public.user_settings') is not null then 'user_settings=PASS' else 'user_settings=FAIL' end;
                select case when to_regclass('public.user_consents') is not null then 'user_consents=PASS' else 'user_consents=FAIL' end;
                select case when to_regclass('supabase_migrations.schema_migrations') is not null then 'migration_history=PASS' else 'migration_history=FAIL' end;
                select case when exists (select 1 from supabase_migrations.schema_migrations where version='20261123191500') then 'eng_p02_migration=PASS' else 'eng_p02_migration=FAIL' end;
                select case when to_regclass('public.organizations') is not null and to_regclass('public.organization_memberships') is not null and to_regclass('public.audit_events') is not null then 'tenant_schema=PASS' else 'tenant_schema=FAIL' end;
                select case when bool_and(relrowsecurity) then 'identity_rls=PASS' else 'identity_rls=FAIL' end
                  from pg_class c join pg_namespace n on n.oid=c.relnamespace
                 where n.nspname='public' and c.relname in ('profiles','user_settings','user_consents');
                select 'profile_rows=' || count(*) from public.profiles;
                select 'settings_rows=' || count(*) from public.user_settings;
                select 'consent_rows=' || count(*) from public.user_consents;
                select 'remote_migration_high_water=' || coalesce(max(version), 'none') from supabase_migrations.schema_migrations;
              " | tee recovery-evidence/restore-verification.txt
          for assertion in database_identity auth_users profiles user_settings user_consents migration_history eng_p02_migration tenant_schema identity_rls; do
            grep -q "^$assertion=PASS$" recovery-evidence/restore-verification.txt
          done

      - name: Apply ENG-P03 account lifecycle migration to disposable restored database
        shell: bash
        run: |
          set -euo pipefail
          migration="apps/api/supabase/migrations/20261123191600_eng_p03_account_export_and_deletion_request_lifecycle.sql"
          test -s "$migration"
          docker cp "$migration" "$SUPABASE_DB_CONTAINER:/tmp/eng-p03-account-lifecycle.sql"
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification \
              -v ON_ERROR_STOP=1 -f /tmp/eng-p03-account-lifecycle.sql
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 -Atc "
              select case when to_regclass('public.account_export_jobs') is not null then 'account_export_jobs=PASS' else 'account_export_jobs=FAIL' end;
              select case when to_regclass('public.account_deletion_requests') is not null then 'account_deletion_requests=PASS' else 'account_deletion_requests=FAIL' end;
              select case when to_regclass('public.account_lifecycle_events') is not null then 'account_lifecycle_events=PASS' else 'account_lifecycle_events=FAIL' end;
              select case when to_regclass('public.account_data_retention_policies') is not null then 'retention_policies=PASS' else 'retention_policies=FAIL' end;
              select case when to_regclass('public.account_legal_holds') is not null then 'legal_holds=PASS' else 'legal_holds=FAIL' end;
              select case when to_regclass('private.account_export_sources') is not null and (select count(*) from private.account_export_sources where enabled) > 0 then 'export_source_registry=PASS' else 'export_source_registry=FAIL' end;
              select case when exists(select 1 from storage.buckets where id='account-exports' and public=false) then 'private_export_bucket=PASS' else 'private_export_bucket=FAIL' end;
              select case when (select count(*) from public.account_data_retention_policies where active) = 0 then 'deletion_policy_fail_closed=PASS' else 'deletion_policy_fail_closed=FAIL' end;
              select case when private.redact_account_export_jsonb(
                jsonb_build_object('api_key','root','nested',jsonb_build_object('refresh_token','secret','visible','ok'),'items',jsonb_build_array(jsonb_build_object('password','secret','id',1))),
                array['api_key','refresh_token','password']::text[]
              ) = jsonb_build_object('nested',jsonb_build_object('visible','ok'),'items',jsonb_build_array(jsonb_build_object('id',1)))
                then 'recursive_secret_redaction=PASS' else 'recursive_secret_redaction=FAIL' end;
              select case when has_function_privilege('authenticated','public.request_my_account_export(text)','EXECUTE') then 'owner_export_rpc=PASS' else 'owner_export_rpc=FAIL' end;
              select case when has_function_privilege('service_role','public.set_account_retention_policy_active(uuid,uuid,boolean)','EXECUTE')
                            and not has_function_privilege('authenticated','public.set_account_retention_policy_active(uuid,uuid,boolean)','EXECUTE')
                          then 'retention_activation_rpc_grants=PASS' else 'retention_activation_rpc_grants=FAIL' end;
              do \$\$
              begin
                perform public.set_account_retention_policy_active(gen_random_uuid(),gen_random_uuid(),true);
                raise exception 'retention policy activation must reject an actor without the operator scope';
              exception when insufficient_privilege then
                null;
              end;
              \$\$;
              select case when has_function_privilege('service_role','public.claim_account_export_jobs(text,integer,integer)','EXECUTE')
                            and not has_function_privilege('authenticated','public.claim_account_export_jobs(text,integer,integer)','EXECUTE')
                          then 'worker_rpc_grants=PASS' else 'worker_rpc_grants=FAIL' end;
              select case when has_function_privilege('service_role','public.create_account_deletion_request_for_actor(uuid)','EXECUTE')
                            and not has_function_privilege('authenticated','public.create_account_deletion_request_for_actor(uuid)','EXECUTE')
                            and has_function_privilege('authenticated','public.cancel_my_account_deletion(uuid)','EXECUTE')
                          then 'deletion_rpc_grants=PASS' else 'deletion_rpc_grants=FAIL' end;
              select case when bool_and(relrowsecurity) then 'account_lifecycle_rls=PASS' else 'account_lifecycle_rls=FAIL' end
                from pg_class c join pg_namespace n on n.oid=c.relnamespace
               where n.nspname='public' and c.relname in ('account_export_jobs','account_deletion_requests','account_lifecycle_events','account_data_retention_policies','account_legal_holds');
            " | tee recovery-evidence/p03-disposable-migration-verification.txt
          for assertion in account_export_jobs account_deletion_requests account_lifecycle_events retention_policies legal_holds export_source_registry private_export_bucket deletion_policy_fail_closed recursive_secret_redaction retention_activation_rpc_grants owner_export_rpc worker_rpc_grants deletion_rpc_grants account_lifecycle_rls; do
            grep -q "^$assertion=PASS$" recovery-evidence/p03-disposable-migration-verification.txt
          done
          echo "P03_MIGRATION_BLOB=$(git rev-parse HEAD:"$migration")" >> "$GITHUB_ENV"

      - name: Apply ENG-P03 append-only consent migration to disposable restored database
        shell: bash
        run: |
          set -euo pipefail
          migration="apps/api/supabase/migrations/20261123191700_eng_p03_consent_event_history.sql"
          test -s "$migration"
          docker cp "$migration" "$SUPABASE_DB_CONTAINER:/tmp/eng-p03-consent-events.sql"
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification \
              -v ON_ERROR_STOP=1 -f /tmp/eng-p03-consent-events.sql
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 -Atc "
              select case when to_regclass('public.user_consent_events') is not null then 'consent_events_table=PASS' else 'consent_events_table=FAIL' end;
              select case when exists(select 1 from private.account_export_sources where source_key='consent_events' and table_name='user_consent_events' and enabled) then 'consent_export_source=PASS' else 'consent_export_source=FAIL' end;
              select case when (select relrowsecurity from pg_class where oid='public.user_consent_events'::regclass) then 'consent_events_rls=PASS' else 'consent_events_rls=FAIL' end;
              select case when has_table_privilege('authenticated','public.user_consent_events','SELECT')
                            and not has_table_privilege('authenticated','public.user_consent_events','INSERT')
                            and not has_table_privilege('authenticated','public.user_consent_events','UPDATE')
                            and not has_table_privilege('authenticated','public.user_consent_events','DELETE')
                          then 'consent_events_client_read_only=PASS' else 'consent_events_client_read_only=FAIL' end;
              select case when has_table_privilege('authenticated','public.user_consents','SELECT')
                            and not has_table_privilege('authenticated','public.user_consents','INSERT')
                          then 'legacy_consent_write_closed=PASS' else 'legacy_consent_write_closed=FAIL' end;
              select case when has_function_privilege('service_role','public.record_account_consent_event_for_actor(uuid,text,text,text,text,text)','EXECUTE')
                            and not has_function_privilege('authenticated','public.record_account_consent_event_for_actor(uuid,text,text,text,text,text)','EXECUTE')
                            and not has_function_privilege('anon','public.record_account_consent_event_for_actor(uuid,text,text,text,text,text)','EXECUTE')
                          then 'consent_rpc_service_only=PASS' else 'consent_rpc_service_only=FAIL' end;
            " | tee recovery-evidence/p03-consent-event-verification.txt
          for assertion in consent_events_table consent_export_source consent_events_rls consent_events_client_read_only legacy_consent_write_closed consent_rpc_service_only; do
            grep -q "^$assertion=PASS$" recovery-evidence/p03-consent-event-verification.txt
          done
          docker exec -i -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          set local role service_role;
          select set_config('request.jwt.claim.role','service_role',true);
          do $$
          declare
            v_actor uuid;
            v_first uuid;
            v_second uuid;
          begin
            select id into v_actor from auth.users order by created_at limit 1;
            if v_actor is null then raise exception 'restore verifier requires an existing auth actor'; end if;
            select id into v_first from public.record_account_consent_event_for_actor(
              v_actor,'product_updates','restore-verifier-v1','granted','account_settings','restore-consent-0001'
            );
            select id into v_second from public.record_account_consent_event_for_actor(
              v_actor,'product_updates','restore-verifier-v1','granted','account_settings','restore-consent-0001'
            );
            if v_first is null or v_first is distinct from v_second then
              raise exception 'consent idempotency replay did not return the original event';
            end if;
            begin
              perform 1 from public.record_account_consent_event_for_actor(
                v_actor,'privacy_policy','restore-verifier-v1','revoked','account_settings','restore-consent-0002'
              );
              raise exception 'required policy withdrawal must be rejected';
            exception when insufficient_privilege then
              null;
            end;
          end;
          $$;
          rollback;
          SQL
          echo "consent_rpc_behavior=PASS" | tee -a recovery-evidence/p03-consent-event-verification.txt
          echo "P03_CONSENT_MIGRATION_BLOB=$(git rev-parse HEAD:"$migration")" >> "$GITHUB_ENV"

      - name: Publish sanitized restore-test evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          archive = Path("recovery-evidence/allpha-p02-pre-migration.dump")
          verification = Path("recovery-evidence/restore-verification.txt")
          p03_verification = Path("recovery-evidence/p03-disposable-migration-verification.txt")
          result = {
              "project_ref": "dvdziauyvuhcnqhrrvww",
              "source_backup_run_id": int(os.environ["BACKUP_RUN_ID"]),
              "source_backup_artifact_name": "eng-p02-pre-migration-db-backup",
              "backup_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "restore_completed": True,
              "production_database_touched": False,
              "production_migration_applied": False,
              "p03_disposable_migration_applied": True,
              "p03_migration_blob": os.environ["P03_MIGRATION_BLOB"],
              "p03_consent_migration_applied": True,
              "p03_consent_migration_blob": os.environ["P03_CONSENT_MIGRATION_BLOB"],
              "storage_objects_included": False,
              "verified_at_utc": datetime.now(timezone.utc).isoformat(),
              "verification": verification.read_text().splitlines(),
              "p03_migration_verification": p03_verification.read_text().splitlines(),
              "p03_consent_migration_verification": Path("recovery-evidence/p03-consent-event-verification.txt").read_text().splitlines(),
          }
          Path("recovery-evidence/restore-verification.json").write_text(json.dumps(result, indent=2) + "\n")
          PY

      - name: Upload verified disposable restore evidence
        uses: actions/upload-artifact@v4
        with:
          name: eng-p02-disposable-restore-verification
          path: |
            recovery-evidence/restore-verification.json
            recovery-evidence/restore-verification.txt
            recovery-evidence/p03-disposable-migration-verification.txt
            recovery-evidence/p03-consent-event-verification.txt
          if-no-files-found: error
          retention-days: 90
          overwrite: true
