name: ENG-P02 Verify Pre-Migration Backup Restore
on:
  workflow_run:
    workflows: ["ENG-P02 Create Pre-Migration Database Backup"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: eng-p02-backup-restore-verification
  cancel-in-progress: false

jobs:
  restore-backup-to-disposable-supabase-postgres:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKUP_RUN_ID: ${{ github.event.workflow_run.id }}
      EXPECTED_EXPORT_LEASE_MIGRATION_BLOB: aa5fe5763432f8a2c9ca31fffb432b2327aa98c2

    steps:
      - uses: actions/checkout@v4

      - name: Download the exact pre-migration backup artifact
        uses: actions/download-artifact@v4
        with:
          name: eng-p02-pre-migration-db-backup
          path: recovery-evidence
          run-id: ${{ env.BACKUP_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify artifact identity and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s recovery-evidence/allpha-p02-pre-migration.dump
          test -s recovery-evidence/restore-point-evidence.json
          actual_sha256="$(sha256sum recovery-evidence/allpha-p02-pre-migration.dump | awk '{print $1}')"
          export ACTUAL_BACKUP_SHA256="$actual_sha256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("recovery-evidence/restore-point-evidence.json").read_text())
          assert manifest["project_ref"] == "dvdziauyvuhcnqhrrvww"
          assert manifest["restore_tested"] is False
          assert manifest["database_migration_applied"] is False
          assert manifest["restore_executed"] is False
          assert manifest["sha256"] == os.environ["ACTUAL_BACKUP_SHA256"]
          print("Fresh backup artifact identity and checksum verified.")
          PY

      - name: Create an isolated Supabase restore workspace without project migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restore-workspace/supabase
          restore_db_port=$((63000 + BACKUP_RUN_ID % 1000))
          python - "$restore_db_port" <<'PY'
          import socket, sys
          port = int(sys.argv[1])
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
              sock.bind(("127.0.0.1", port))
          print(f"Disposable PostgreSQL host port {port} is available.")
          PY
          cat > restore-workspace/supabase/config.toml <<'TOML'
          project_id = "allpha-p02-restore-verification"

          [api]
          enabled = false

          [db]
          port = 54322
          major_version = 17

          [db.migrations]
          schema_paths = []
          TOML
          # Use a serialized, high-range run-specific host port and verify it is free before startup.
          sed -i "s/^port = 54322$/port = $restore_db_port/" restore-workspace/supabase/config.toml

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Start an isolated Supabase PostgreSQL 17 stack
        working-directory: restore-workspace
        shell: bash
        run: |
          set -euo pipefail
          supabase start

      - name: Resolve the Supabase PostgreSQL container and privileged restore role
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_allpha-p02-restore-verification' | head -n 1)"
          test -n "$db_container"
          role_state="$(docker exec -u postgres "$db_container" psql -U postgres -d postgres -Atc \
            "select rolcanlogin::text || '|' || rolsuper::text from pg_roles where rolname='supabase_admin'")"
          test "$role_state" = "true|true"
          echo "SUPABASE_DB_CONTAINER=$db_container" >> "$GITHUB_ENV"

      - name: Create a separate disposable restore database
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            createdb -U supabase_admin -O supabase_admin allpha_p02_restore_verification

      - name: Configure pg_cron for the isolated restore database without executing scheduled jobs
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c \
            "ALTER SYSTEM SET cron.database_name = 'allpha_p02_restore_verification';"
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c \
            "ALTER SYSTEM SET cron.launch_active_jobs = 'off';"
          docker restart "$SUPABASE_DB_CONTAINER"
          for attempt in $(seq 1 60); do
            if docker exec -u postgres "$SUPABASE_DB_CONTAINER" pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              cron_config="$(docker exec -u postgres "$SUPABASE_DB_CONTAINER" psql -U supabase_admin -d postgres -Atc \
                "select current_setting('cron.database_name') || '|' || current_setting('cron.launch_active_jobs')")"
              if [ "$cron_config" = "allpha_p02_restore_verification|off" ]; then
                echo "Disposable pg_cron database configured; scheduled jobs remain disabled."
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Disposable pg_cron configuration did not become ready after ${attempt} attempts." >&2
          exit 1

      - name: Restore the full custom archive into the disposable database
        shell: bash
        run: |
          set -euo pipefail
          docker cp recovery-evidence/allpha-p02-pre-migration.dump \
            "$SUPABASE_DB_CONTAINER:/tmp/allpha-p02-pre-migration.dump"
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            pg_restore \
              --username=supabase_admin \
              --dbname=allpha_p02_restore_verification \
              --no-owner \
              --no-privileges \
              --exit-on-error \
              /tmp/allpha-p02-pre-migration.dump

      - name: Verify restored schema, RLS and ENG-P02 migration
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification \
              -v ON_ERROR_STOP=1 -Atc "
                select case when current_database()='allpha_p02_restore_verification' then 'database_identity=PASS' else 'database_identity=FAIL' end;
                select case when to_regclass('auth.users') is not null then 'auth_users=PASS' else 'auth_users=FAIL' end;
                select case when to_regclass('public.profiles') is not null then 'profiles=PASS' else 'profiles=FAIL' end;
                select case when to_regclass('public.user_settings') is not null then 'user_settings=PASS' else 'user_settings=FAIL' end;
                select case when to_regclass('public.user_consents') is not null then 'user_consents=PASS' else 'user_consents=FAIL' end;
                select case when to_regclass('supabase_migrations.schema_migrations') is not null then 'migration_history=PASS' else 'migration_history=FAIL' end;
                select case when exists (select 1 from supabase_migrations.schema_migrations where version='20261123191500') then 'eng_p02_migration=PASS' else 'eng_p02_migration=FAIL' end;
                select case when to_regclass('public.organizations') is not null and to_regclass('public.organization_memberships') is not null and to_regclass('public.audit_events') is not null then 'tenant_schema=PASS' else 'tenant_schema=FAIL' end;
                select case when bool_and(relrowsecurity) then 'identity_rls=PASS' else 'identity_rls=FAIL' end
                  from pg_class c join pg_namespace n on n.oid=c.relnamespace
                 where n.nspname='public' and c.relname in ('profiles','user_settings','user_consents');
                select 'profile_rows=' || count(*) from public.profiles;
                select 'settings_rows=' || count(*) from public.user_settings;
                select 'consent_rows=' || count(*) from public.user_consents;
                select 'remote_migration_high_water=' || coalesce(max(version), 'none') from supabase_migrations.schema_migrations;
              " | tee recovery-evidence/restore-verification.txt
          for assertion in database_identity auth_users profiles user_settings user_consents migration_history eng_p02_migration tenant_schema identity_rls; do
            grep -q "^$assertion=PASS$" recovery-evidence/restore-verification.txt
          done

      - name: Apply ENG-P03 account lifecycle migration to disposable restored database
        shell: bash
        run: |
          set -euo pipefail
          migration="apps/api/supabase/migrations/20261123191600_eng_p03_account_export_and_deletion_request_lifecycle.sql"
          test -s "$migration"
          docker cp "$migration" "$SUPABASE_DB_CONTAINER:/tmp/eng-p03-account-lifecycle.sql"
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification \
              -v ON_ERROR_STOP=1 -f /tmp/eng-p03-account-lifecycle.sql
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 -Atc "
              select case when to_regclass('public.account_export_jobs') is not null then 'account_export_jobs=PASS' else 'account_export_jobs=FAIL' end;
              select case when to_regclass('public.account_deletion_requests') is not null then 'account_deletion_requests=PASS' else 'account_deletion_requests=FAIL' end;
              select case when to_regclass('public.account_lifecycle_events') is not null then 'account_lifecycle_events=PASS' else 'account_lifecycle_events=FAIL' end;
              select case when to_regclass('public.account_data_retention_policies') is not null then 'retention_policies=PASS' else 'retention_policies=FAIL' end;
              select case when to_regclass('public.account_legal_holds') is not null then 'legal_holds=PASS' else 'legal_holds=FAIL' end;
              select case when to_regclass('private.account_export_sources') is not null and (select count(*) from private.account_export_sources where enabled) > 0 then 'export_source_registry=PASS' else 'export_source_registry=FAIL' end;
              select case when exists(select 1 from storage.buckets where id='account-exports' and public=false) then 'private_export_bucket=PASS' else 'private_export_bucket=FAIL' end;
              select case when
                (select count(*) from public.account_data_retention_policies where active) = 6
                and (select array_agg(data_class order by data_class)
                       from public.account_data_retention_policies where active)
                    = ARRAY['agent_operational','owner_private','public_catalog','published_knowledge','session_scoped','tenant_shared']::text[]
                and not exists (
                  select 1 from public.account_data_retention_policies
                   where active and (
                     decision_source <> 'product_owner_directive'
                     or decision_reference is null
                     or policy_version <> 'owner-directive-2026-11-23-v1'
                     or retention_days <> 0
                   )
                )
              then 'retention_policy_baseline=PASS' else 'retention_policy_baseline=FAIL' end;
              select case when private.redact_account_export_jsonb(
                jsonb_build_object('api_key','root','nested',jsonb_build_object('refresh_token','secret','visible','ok'),'items',jsonb_build_array(jsonb_build_object('password','secret','id',1))),
                array['api_key','refresh_token','password']::text[]
              ) = jsonb_build_object('nested',jsonb_build_object('visible','ok'),'items',jsonb_build_array(jsonb_build_object('id',1)))
                then 'recursive_secret_redaction=PASS' else 'recursive_secret_redaction=FAIL' end;
              select case when has_function_privilege('authenticated','public.request_my_account_export(text)','EXECUTE') then 'owner_export_rpc=PASS' else 'owner_export_rpc=FAIL' end;
              select case when has_function_privilege('service_role','public.set_account_retention_policy_active(uuid,uuid,boolean)','EXECUTE')
                            and not has_function_privilege('authenticated','public.set_account_retention_policy_active(uuid,uuid,boolean)','EXECUTE')
                          then 'retention_activation_rpc_grants=PASS' else 'retention_activation_rpc_grants=FAIL' end;
              do \$\$
              begin
                perform public.set_account_retention_policy_active(gen_random_uuid(),gen_random_uuid(),true);
                raise exception 'retention policy activation must reject an actor without the operator scope';
              exception when insufficient_privilege then
                null;
              end;
              \$\$;
              select case when has_function_privilege('service_role','public.claim_account_export_jobs(text,integer,integer)','EXECUTE')
                            and not has_function_privilege('authenticated','public.claim_account_export_jobs(text,integer,integer)','EXECUTE')
                          then 'worker_rpc_grants=PASS' else 'worker_rpc_grants=FAIL' end;
              select case when has_function_privilege('service_role','public.create_account_deletion_request_for_actor(uuid)','EXECUTE')
                            and not has_function_privilege('authenticated','public.create_account_deletion_request_for_actor(uuid)','EXECUTE')
                            and has_function_privilege('authenticated','public.cancel_my_account_deletion(uuid)','EXECUTE')
                          then 'deletion_rpc_grants=PASS' else 'deletion_rpc_grants=FAIL' end;
              select case when bool_and(relrowsecurity) then 'account_lifecycle_rls=PASS' else 'account_lifecycle_rls=FAIL' end
                from pg_class c join pg_namespace n on n.oid=c.relnamespace
               where n.nspname='public' and c.relname in ('account_export_jobs','account_deletion_requests','account_lifecycle_events','account_data_retention_policies','account_legal_holds');
            " | tee recovery-evidence/p03-disposable-migration-verification.txt
          for assertion in account_export_jobs account_deletion_requests account_lifecycle_events retention_policies legal_holds export_source_registry private_export_bucket retention_policy_baseline recursive_secret_redaction retention_activation_rpc_grants owner_export_rpc worker_rpc_grants deletion_rpc_grants account_lifecycle_rls; do
            grep -q "^$assertion=PASS$" recovery-evidence/p03-disposable-migration-verification.txt
          done
          echo "P03_MIGRATION_BLOB=$(git rev-parse HEAD:"$migration")" >> "$GITHUB_ENV"

      - name: Apply ENG-P03 append-only consent migration to disposable restored database
        shell: bash
        run: |
          set -euo pipefail
          migration="apps/api/supabase/migrations/20261123191700_eng_p03_consent_event_history.sql"
          test -s "$migration"
          docker cp "$migration" "$SUPABASE_DB_CONTAINER:/tmp/eng-p03-consent-events.sql"
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification \
              -v ON_ERROR_STOP=1 -f /tmp/eng-p03-consent-events.sql
          lease_migration="apps/api/supabase/migrations/20261123191800_eng_p03_lease_scoped_export_artifacts.sql"
          lease_migration_blob="$(git rev-parse HEAD:"$lease_migration")"
          test "$lease_migration_blob" = "$EXPECTED_EXPORT_LEASE_MIGRATION_BLOB"
          docker cp "$lease_migration" "$SUPABASE_DB_CONTAINER:/tmp/eng-p03-export-lease.sql"
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification \
              -v ON_ERROR_STOP=1 -f /tmp/eng-p03-export-lease.sql
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 -Atc "
              select case when to_regclass('public.user_consent_events') is not null then 'consent_events_table=PASS' else 'consent_events_table=FAIL' end;
              select case when exists(select 1 from private.account_export_sources where source_key='consent_events' and table_name='user_consent_events' and enabled) then 'consent_export_source=PASS' else 'consent_export_source=FAIL' end;
              select case when (select relrowsecurity from pg_class where oid='public.user_consent_events'::regclass) then 'consent_events_rls=PASS' else 'consent_events_rls=FAIL' end;
              select case when has_table_privilege('authenticated','public.user_consent_events','SELECT')
                            and not has_table_privilege('authenticated','public.user_consent_events','INSERT')
                            and not has_table_privilege('authenticated','public.user_consent_events','UPDATE')
                            and not has_table_privilege('authenticated','public.user_consent_events','DELETE')
                          then 'consent_events_client_read_only=PASS' else 'consent_events_client_read_only=FAIL' end;
              select case when has_table_privilege('authenticated','public.user_consents','SELECT')
                            and not has_table_privilege('authenticated','public.user_consents','INSERT')
                          then 'legacy_consent_write_closed=PASS' else 'legacy_consent_write_closed=FAIL' end;
              select case when has_function_privilege('service_role','public.record_account_consent_event_for_actor(uuid,text,text,text,text,text)','EXECUTE')
                            and not has_function_privilege('authenticated','public.record_account_consent_event_for_actor(uuid,text,text,text,text,text)','EXECUTE')
                            and not has_function_privilege('anon','public.record_account_consent_event_for_actor(uuid,text,text,text,text,text)','EXECUTE')
                          then 'consent_rpc_service_only=PASS' else 'consent_rpc_service_only=FAIL' end;
              select case when position('on conflict on constraint user_consent_events_user_id_idempotency_key_key do nothing' in lower(pg_get_functiondef(
                'public.record_account_consent_event_for_actor(uuid,text,text,text,text,text)'::regprocedure
              ))) > 0 then 'consent_idempotency_conflict_target=PASS' else 'consent_idempotency_conflict_target=FAIL' end;
            " | tee recovery-evidence/p03-consent-event-verification.txt
          for assertion in consent_events_table consent_export_source consent_events_rls consent_events_client_read_only legacy_consent_write_closed consent_rpc_service_only consent_idempotency_conflict_target; do
            grep -q "^$assertion=PASS$" recovery-evidence/p03-consent-event-verification.txt
          done
          docker exec -i -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select id as restore_actor_id from auth.users order by created_at limit 1 \gset
          set local role service_role;
          select set_config('request.jwt.claim.role','service_role',true);
          select set_config('request.jwt.claim.sub', :'restore_actor_id', true);
          do $consent_verifier$
          declare
            v_actor uuid := current_setting('request.jwt.claim.sub')::uuid;
            v_first uuid;
            v_second uuid;
          begin
            if v_actor is null then raise exception 'restore verifier requires an existing auth actor'; end if;
            select id into v_first from public.record_account_consent_event_for_actor(
              v_actor,'product_updates','restore-verifier-v1','granted','account_settings','restore-consent-0001'
            );
            select id into v_second from public.record_account_consent_event_for_actor(
              v_actor,'product_updates','restore-verifier-v1','granted','account_settings','restore-consent-0001'
            );
            if v_first is null or v_first is distinct from v_second then
              raise exception 'consent idempotency replay did not return the original event';
            end if;
            begin
              perform 1 from public.record_account_consent_event_for_actor(
                v_actor,'privacy_policy','restore-verifier-v1','revoked','account_settings','restore-consent-0002'
              );
              raise exception 'required policy withdrawal must be rejected';
            exception when insufficient_privilege then
              null;
            end;
          end;
          $consent_verifier$;
          rollback;
          SQL
          echo "consent_rpc_behavior=PASS" | tee -a recovery-evidence/p03-consent-event-verification.txt
          echo "P03_CONSENT_MIGRATION_BLOB=$(git rev-parse HEAD:"$migration")" >> "$GITHUB_ENV"

      - name: Verify ENG-P03 lease-scoped export artifact migration and behavior on disposable restore
        shell: bash
        run: |
          set -euo pipefail
          migration="apps/api/supabase/migrations/20261123191800_eng_p03_lease_scoped_export_artifacts.sql"
          test -s "$migration"
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 -Atc "
              select case when position('p_lease_token::text' in pg_get_functiondef(
                'public.complete_account_export_job(uuid,uuid,text,text,bigint,jsonb)'::regprocedure
              )) > 0 then 'lease_scoped_completion_rpc=PASS' else 'lease_scoped_completion_rpc=FAIL' end;
            " | tee recovery-evidence/p03-export-lease-verification.txt
          for assertion in lease_scoped_completion_rpc; do
            grep -q "^$assertion=PASS$" recovery-evidence/p03-export-lease-verification.txt
          done
          docker exec -i -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select id as restore_actor_id from auth.users order by created_at limit 1 \gset
          set local role service_role;
          select set_config('request.jwt.claim.role','service_role',true);
          select set_config('request.jwt.claim.sub', :'restore_actor_id', true);
          do $export_verifier$
          declare
            v_actor uuid := current_setting('request.jwt.claim.sub')::uuid;
            v_job uuid;
            v_lease uuid := gen_random_uuid();
            v_completed boolean;
          begin
            if v_actor is null then raise exception 'restore verifier requires an existing auth actor'; end if;
            insert into public.account_export_jobs(
              user_id,idempotency_key,status,attempts,lease_token,lease_owner,lease_expires_at
            ) values (
              v_actor,'restore-lease-' || substr(gen_random_uuid()::text,1,16),
              'running',1,v_lease,'restore-verifier',now() + interval '15 minutes'
            ) returning id into v_job;
            v_completed := public.complete_account_export_job(
              v_job,v_lease,
              v_actor::text || '/' || v_job::text || '/' || v_lease::text || '.json.gz',
              repeat('a',64),1,'{}'::jsonb
            );
            if v_completed is distinct from true then
              raise exception 'lease-scoped export completion was rejected';
            end if;
          end;
          $export_verifier$;
          rollback;
          SQL
          echo "lease_scoped_completion_behavior=PASS" | tee -a recovery-evidence/p03-export-lease-verification.txt
          echo "P03_EXPORT_LEASE_MIGRATION_BLOB=$(git rev-parse HEAD:"$migration")" >> "$GITHUB_ENV"

      - name: Verify ENG-P03 export artifact expiration and cleanup lifecycle on disposable restore
        shell: bash
        run: |
          set -euo pipefail
          migration="apps/api/supabase/migrations/20261123192100_eng_p03_export_artifact_expiration.sql"
          test -s "$migration"
          docker cp "$migration" "$SUPABASE_DB_CONTAINER:/tmp/eng-p03-export-expiry.sql"
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 \
            -f /tmp/eng-p03-export-expiry.sql
          docker exec -i -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 <<'SQL' | tee recovery-evidence/p03-export-expiry-verification.txt
          begin;
          select id as restore_actor_id from auth.users order by created_at limit 1 \gset
          set local role service_role;
          select set_config('request.jwt.claim.role','service_role',true);
          select set_config('request.jwt.claim.sub', :'restore_actor_id', true);
          do $export_expiry_verifier$
          declare
            v_actor uuid := current_setting('request.jwt.claim.sub')::uuid;
            v_job uuid;
            v_claim record;
            v_expires_at timestamptz;
            v_queued integer;
            v_completed boolean;
            v_status text;
          begin
            insert into public.account_data_retention_policies(
              data_class,retention_days,policy_version,legal_basis,approved_by,approved_at,active
            ) values (
              'account_export_artifact',0,'restore-verifier-v1',
              'Disposable PostgreSQL restore-only verification policy.',v_actor,now(),true
            );
            insert into public.account_export_jobs(
              user_id,idempotency_key,status,storage_bucket,storage_path
            ) values (
              v_actor,'restore-expiry-' || substr(gen_random_uuid()::text,1,16),
              'running','account-exports',
              v_actor::text || '/' || gen_random_uuid()::text || '/restore.json.gz'
            ) returning id into v_job;
            update public.account_export_jobs set status='succeeded' where id=v_job
              returning expires_at into v_expires_at;
            if v_expires_at is null or v_expires_at > clock_timestamp() then
              raise exception 'approved zero-day artifact policy did not expire the archive';
            end if;
            v_queued := public.enqueue_expired_account_export_artifacts();
            if v_queued <> 1 then raise exception 'expired artifact was not enqueued'; end if;
            select * into v_claim from public.claim_account_export_artifact_cleanup_jobs(
              'restore-expiry-verifier',1,300
            );
            if v_claim.id is null then raise exception 'expired artifact cleanup claim missing'; end if;
            v_completed := public.complete_account_export_artifact_cleanup_job(v_claim.id,v_claim.lease_token);
            if v_completed is distinct from true then raise exception 'artifact cleanup completion rejected'; end if;
            select status into v_status from public.account_export_jobs where id=v_job;
            if v_status <> 'expired' then raise exception 'export job did not transition to expired'; end if;
          end;
          $export_expiry_verifier$;
          rollback;
          SQL
          echo "export_artifact_policy_expiry_behavior=PASS" | tee -a recovery-evidence/p03-export-expiry-verification.txt
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 -Atc "
              select case when to_regclass('public.account_export_artifact_cleanup_jobs') is not null
                then 'export_cleanup_queue=PASS' else 'export_cleanup_queue=FAIL' end;
              select case when exists(select 1 from information_schema.columns
                where table_schema='public' and table_name='account_export_jobs' and column_name='expires_at')
                then 'export_expires_at=PASS' else 'export_expires_at=FAIL' end;
            " | tee -a recovery-evidence/p03-export-expiry-verification.txt
          grep -q '^export_cleanup_queue=PASS$' recovery-evidence/p03-export-expiry-verification.txt
          grep -q '^export_expires_at=PASS$' recovery-evidence/p03-export-expiry-verification.txt
          echo "P03_EXPORT_EXPIRY_MIGRATION_BLOB=$(git rev-parse HEAD:"$migration")" >> "$GITHUB_ENV"

      - name: Verify ENG-P03 deletion legal-hold governance on disposable restore
        shell: bash
        run: |
          set -euo pipefail
          migration="apps/api/supabase/migrations/20261123192200_eng_p03_deletion_legal_hold_governance_worker.sql"
          test -s "$migration"
          migration_version="20261123192200"
          applied="$(docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -Atqc \
            "select exists(select 1 from supabase_migrations.schema_migrations where version='${migration_version}')")"
          if [[ "$applied" == "t" ]]; then
            echo "deletion_governance_migration_replay=SKIPPED_ALREADY_APPLIED"
          else
            docker cp "$migration" "$SUPABASE_DB_CONTAINER:/tmp/eng-p03-deletion-governance.sql"
            docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
              psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 \
              -f /tmp/eng-p03-deletion-governance.sql
            echo "deletion_governance_migration_replay=APPLIED_TO_RESTORE"
          fi

          # The hold-release trigger must persist its own audit event when it
          # requeues blocked requests before the governance worker runs.
          requeue_migration="apps/api/supabase/migrations/20261124012454_eng_p03_requeue_audit_trail.sql"
          test -s "$requeue_migration"
          requeue_applied="$(docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -Atqc \
            "select exists(select 1 from supabase_migrations.schema_migrations where version='20261124012454')")"
          if [[ "$requeue_applied" == "t" ]]; then
            echo "deletion_hold_release_audit_migration=SKIPPED_ALREADY_APPLIED"
          else
            docker cp "$requeue_migration" "$SUPABASE_DB_CONTAINER:/tmp/eng-p03-requeue-audit-trail.sql"
            docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
              psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 \
              -f /tmp/eng-p03-requeue-audit-trail.sql
            echo "deletion_hold_release_audit_migration=APPLIED_TO_RESTORE"
          fi
          echo "P03_REQUEUE_AUDIT_MIGRATION_BLOB=$(git rev-parse HEAD:"$requeue_migration")" >> "$GITHUB_ENV"

          docker exec -i -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 <<'SQL' | tee recovery-evidence/p03-deletion-governance-verification.txt
          begin;
          select id as restore_actor_id from auth.users order by created_at limit 1 \gset
          set local role service_role;
          select set_config('request.jwt.claim.role','service_role',true);
          select set_config('request.jwt.claim.sub', :'restore_actor_id', true);
          do $deletion_governance_verifier$
          declare
            v_actor uuid := current_setting('request.jwt.claim.sub')::uuid;
            v_subject text := (md5(gen_random_uuid()::text) || md5(gen_random_uuid()::text));
            v_request uuid;
            v_hold uuid;
            v_result record;
            v_status text;
            v_error text;
          begin
            insert into public.account_legal_holds(subject_ref,reference_code,reason_code,active,created_by)
            values(v_subject,'RESTORE-' || substr(gen_random_uuid()::text,1,12),'legal_preservation',true,v_actor)
            returning id into v_hold;
            insert into public.account_deletion_requests(user_id,subject_ref,status,request_metadata)
            values(v_actor,v_subject,'awaiting_policy','{}'::jsonb) returning id into v_request;

            select * into v_result from public.evaluate_account_deletion_governance(100);
            select status,error_code into v_status,v_error
              from public.account_deletion_requests where id=v_request;
            if v_status<>'blocked_legal_hold' or v_error<>'LEGAL_HOLD_ACTIVE' then
              raise exception 'active legal hold did not block deletion at the first governance gate';
            end if;
            if not exists(select 1 from public.account_lifecycle_events
              where request_id=v_request and event_type='deletion_blocked'
                and metadata->>'reason_code'='LEGAL_HOLD_ACTIVE') then
              raise exception 'legal-hold block audit event missing';
            end if;

            update public.account_legal_holds
               set active=false,released_at=now(),released_by=v_actor where id=v_hold;
            select * into v_result from public.evaluate_account_deletion_governance(100);
            select status,error_code into v_status,v_error
              from public.account_deletion_requests where id=v_request;
            if v_status='blocked_legal_hold' then
              raise exception 'released legal hold remained an active deletion blocker';
            end if;
            if v_status<>'blocked_dependency' or v_error<>'ACCOUNT_EXPORT_REQUIRED' then
              raise exception 'released request did not advance to the independent export prerequisite gate';
            end if;
            if not exists(select 1 from public.account_lifecycle_events
              where request_id=v_request and event_type='deletion_unblocked'
                and metadata->>'reason_code'='LEGAL_HOLD_RELEASED_REEVALUATION_REQUIRED') then
              raise exception 'legal-hold release audit event missing';
            end if;
            if coalesce((select request_metadata->>'legal_hold_active'
              from public.account_deletion_requests where id=v_request),'true')<>'false' then
              raise exception 'released request retained active legal-hold metadata';
            end if;
            if exists(select 1 from public.account_lifecycle_events
              where request_id=v_request and event_type in ('deletion_started','deletion_completed')) then
              raise exception 'deletion advanced past the independent export prerequisite';
            end if;
          end;
          $deletion_governance_verifier$;
          rollback;
          SQL
          echo "deletion_legal_hold_behavior=PASS" | tee -a recovery-evidence/p03-deletion-governance-verification.txt
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 -Atc "
              select case when has_function_privilege('service_role','public.evaluate_account_deletion_governance(integer)','EXECUTE')
                and not has_function_privilege('authenticated','public.evaluate_account_deletion_governance(integer)','EXECUTE')
                and not has_function_privilege('anon','public.evaluate_account_deletion_governance(integer)','EXECUTE')
                then 'deletion_governance_rpc_grants=PASS' else 'deletion_governance_rpc_grants=FAIL' end;
              select case when exists(select 1 from pg_constraint
                where conname='account_lifecycle_events_event_type_check'
                  and position('deletion_blocked' in pg_get_constraintdef(oid))>0
                  and position('deletion_unblocked' in pg_get_constraintdef(oid))>0
                  and position('deletion_policy_pending' in pg_get_constraintdef(oid))>0
                  and position('deletion_policy_activated' in pg_get_constraintdef(oid))>0
                  and position('retention_policy_activated' in pg_get_constraintdef(oid))>0)
                then 'deletion_event_contract=PASS' else 'deletion_event_contract=FAIL' end;
            " | tee -a recovery-evidence/p03-deletion-governance-verification.txt
          grep -q '^deletion_governance_rpc_grants=PASS$' recovery-evidence/p03-deletion-governance-verification.txt
          grep -q '^deletion_event_contract=PASS$' recovery-evidence/p03-deletion-governance-verification.txt
          echo "P03_DELETION_GOVERNANCE_MIGRATION_BLOB=$(git rev-parse HEAD:"$migration")" >> "$GITHUB_ENV"

      - name: Apply and verify ENG-P13 Cloudinary media registry on disposable restore
        shell: bash
        run: |
          set -euo pipefail
          migration="apps/api/supabase/source-only-migrations/20261125190000_eng_p13_cloudinary_media_registry.sql"
          test -s "$migration"
          docker cp "$migration" "$SUPABASE_DB_CONTAINER:/tmp/eng-p13-cloudinary-media-registry.sql"
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 \
            -f /tmp/eng-p13-cloudinary-media-registry.sql
          docker exec -u postgres "$SUPABASE_DB_CONTAINER" \
            psql -U supabase_admin -d allpha_p02_restore_verification -v ON_ERROR_STOP=1 -Atc "
              select case when public.cloudinary_media_schema_readiness()->>'ready'='true'
                then 'p13_cloudinary_schema_readiness=PASS'
                else 'p13_cloudinary_schema_readiness=FAIL:' || public.cloudinary_media_schema_readiness()::text end;
              select case when
                has_function_privilege('service_role','public.reserve_cloudinary_media_upload(uuid,uuid,uuid,text,text,uuid,uuid,uuid,text,text,bigint,text,text,text,text,timestamptz,text)','EXECUTE')
                and not has_function_privilege('authenticated','public.reserve_cloudinary_media_upload(uuid,uuid,uuid,text,text,uuid,uuid,uuid,text,text,bigint,text,text,text,text,timestamptz,text)','EXECUTE')
                and not has_function_privilege('anon','public.reserve_cloudinary_media_upload(uuid,uuid,uuid,text,text,uuid,uuid,uuid,text,text,bigint,text,text,text,text,timestamptz,text)','EXECUTE')
                then 'p13_media_reservation_grants=PASS' else 'p13_media_reservation_grants=FAIL' end;
              select case when
                (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace
                  where n.nspname='public' and c.relname in ('content_media','content_lifecycle_jobs','content_lifecycle_events','content_provider_callbacks')
                    and c.relrowsecurity)=4
                and exists(select 1 from storage.buckets where id='content-media' and public=false)
                then 'p13_media_rls_and_private_bucket=PASS' else 'p13_media_rls_and_private_bucket=FAIL' end;
            " | tee recovery-evidence/p13-cloudinary-media-registry-verification.txt
          grep -q '^p13_cloudinary_schema_readiness=PASS$' recovery-evidence/p13-cloudinary-media-registry-verification.txt
          grep -q '^p13_media_reservation_grants=PASS$' recovery-evidence/p13-cloudinary-media-registry-verification.txt
          grep -q '^p13_media_rls_and_private_bucket=PASS$' recovery-evidence/p13-cloudinary-media-registry-verification.txt
          echo "P13_CLOUDINARY_MEDIA_MIGRATION_BLOB=$(git rev-parse HEAD:"$migration")" >> "$GITHUB_ENV"

