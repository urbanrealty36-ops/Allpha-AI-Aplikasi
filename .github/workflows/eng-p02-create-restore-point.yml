name: ENG-P02 Create Pre-Migration Database Backup
# Capture a fresh production recovery point; restore gate validates named SQL blocks and applies reviewed P03 migrations only to its disposable copy.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/eng-p02-create-restore-point.yml
      - .github/workflows/eng-p02-backup-restore-verification.yml
      - .github/workflows/eng-p03-apply-account-lifecycle-migration.yml
      - apps/api/supabase/migrations/**
      - apps/api/supabase/source-only-migrations/**
      - apps/api/supabase/migrations/20261123191600_eng_p03_account_export_and_deletion_request_lifecycle.sql
      - apps/api/supabase/migrations/20261123191800_eng_p03_lease_scoped_export_artifacts.sql
      - apps/api/supabase/migrations/20261123192100_eng_p03_export_artifact_expiration.sql
      - apps/api/supabase/migrations/20261123192200_eng_p03_deletion_legal_hold_governance_worker.sql
      - apps/api/supabase/migrations/20261123191900_eng_p04_interest_ontology_and_discovery_index.sql
      - apps/api/supabase/migrations/20261123200000_eng_p04_passion_habit_recommendation_engine.sql
      - apps/api/supabase/source-only-migrations/20261125190000_eng_p13_cloudinary_media_registry.sql
      - apps/api/supabase/source-only-migrations/20261126110000_eng_p09_usage_token_details.sql
      - docs/ADR/ADR-0024-wp07-production-only-migration-and-recovery-gate.md

permissions:
  contents: read

concurrency:
  group: eng-p02-pre-migration-restore-point
  cancel-in-progress: true

jobs:
  create-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: dvdziauyvuhcnqhrrvww
    steps:
      - name: Require canonical production credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is unavailable; cannot resolve the canonical Supavisor endpoint."
            exit 1
          fi
          if [[ -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "::error::SUPABASE_DB_PASSWORD is unavailable; no backup was created and no migration may be applied."
            exit 1
          fi
          test "$SUPABASE_PROJECT_ID" = "dvdziauyvuhcnqhrrvww"
          mkdir -p recovery-evidence

      - name: Resolve the shared session pooler from Supabase Management API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/database/pooler" \
            -o /tmp/pooler-config.json
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          data = json.loads(Path("/tmp/pooler-config.json").read_text())
          if isinstance(data, dict):
              data = [data]
          sanitized = []
          candidates = []
          for item in data:
              connection = str(item.get("connection_string") or item.get("connectionString") or "")
              match = re.search(r"@\[?([A-Za-z0-9.-]+)\]?:([0-9]+)(?:/|$)", connection)
              host = str(item.get("db_host") or (match.group(1) if match else "") or "").strip()
              api_port = int(item.get("db_port") or (match.group(2) if match else 0) or 0)
              authority = connection.split("://", 1)[-1].split("@", 1)[0] if connection else ""
              parsed_user = authority.split(":", 1)[0] if authority else ""
              parsed_db = connection.split("@", 1)[-1].split("/", 1)[1].split("?", 1)[0] if "@" in connection and "/" in connection.split("@", 1)[-1] else ""
              user = str(item.get("db_user") or parsed_user or "").strip()
              database = str(item.get("db_name") or parsed_db or "").strip()
              pool_mode = str(item.get("pool_mode") or "").lower()
              sanitized.append({
                  "identifier": item.get("identifier"),
                  "database_type": item.get("database_type"),
                  "pool_mode": pool_mode,
                  "db_host": host,
                  "api_reported_port": api_port,
                  "db_user": user,
                  "db_name": database,
              })
              if host.endswith(".pooler.supabase.com") and user and database:
                  candidates.append((host, user, database, api_port, pool_mode))
          print(json.dumps({"available_poolers": sanitized}, indent=2))
          if not candidates:
              raise SystemExit("Management API returned no Supavisor shared-pooler host/user/database. Refusing IPv6 direct connection.")
          host, user, database, api_port, mode = candidates[0]
          # Supabase shared session mode uses the same pooler host/user on port 5432;
          # port 6543 is transaction mode. The API response exposes the configured
          # transaction endpoint, so select the documented session port explicitly.
          port = 5432
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"DB_HOST={host}\nDB_PORT={port}\nDB_USER={user}\nDB_NAME={database}\n")
          print(json.dumps({
              "selected_connection_mode": "shared-session",
              "api_reported_port": api_port,
              "selected_session_port": port,
              "api_reported_pool_mode": mode,
              "db_host": host,
              "db_user": user,
              "db_name": database,
          }, indent=2))
          PY

      - name: Create a full PostgreSQL 17 logical backup
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            -e PGSSLMODE=require \
            -v "$PWD/recovery-evidence:/backup" \
            postgres:17-alpine \
            pg_dump \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --username="$DB_USER" \
              --dbname="$DB_NAME" \
              --no-owner \
              --no-privileges \
              --format=custom \
              --compress=6 \
              --file=/backup/allpha-p02-pre-migration.dump
          test -s recovery-evidence/allpha-p02-pre-migration.dump

      - name: Verify dump archive and generate sanitized backup manifest
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/recovery-evidence:/backup" \
            postgres:17-alpine \
            sh -lc 'pg_restore --list /backup/allpha-p02-pre-migration.dump > /backup/dump.toc'
          pg_dump_version="$(docker run --rm postgres:17-alpine pg_dump --version)"
          archive_entries="$(grep -c '^[0-9]' recovery-evidence/dump.toc || true)"
          dump_sha256="$(sha256sum recovery-evidence/allpha-p02-pre-migration.dump | awk '{print $1}')"
          dump_bytes="$(stat -c '%s' recovery-evidence/allpha-p02-pre-migration.dump)"
          server_version="$(docker run --rm \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            -e PGSSLMODE=require \
            postgres:17-alpine \
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc 'select version()')"
          export PG_DUMP_VERSION="$pg_dump_version"
          export ARCHIVE_ENTRIES="$archive_entries"
          export DUMP_SHA256="$dump_sha256"
          export DUMP_BYTES="$dump_bytes"
          export SERVER_VERSION="$server_version"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          manifest = {
              "project_ref": os.environ["SUPABASE_PROJECT_ID"],
              "database_host": os.environ["DB_HOST"],
              "database_port": int(os.environ["DB_PORT"]),
              "database_name": os.environ["DB_NAME"],
              "database_user": os.environ["DB_USER"],
              "database_server_version": os.environ["SERVER_VERSION"],
              "backup_type": "pg_dump_custom_full_database",
              "backup_file": "allpha-p02-pre-migration.dump",
              "pg_dump_version": os.environ["PG_DUMP_VERSION"],
              "archive_toc_entries": int(os.environ["ARCHIVE_ENTRIES"]),
              "sha256": os.environ["DUMP_SHA256"],
              "size_bytes": int(os.environ["DUMP_BYTES"]),
              "captured_at_utc": datetime.now(timezone.utc).isoformat(),
              "archive_integrity_verified": True,
              "restore_tested": False,
              "managed_restore_point_api": "unavailable on prior attempt (HTTP 400: endpoint unavailable)",
              "connection_mode": "Supavisor shared session pooler (IPv4)",
              "pitr_enabled_at_preflight": False,
              "automated_backup_count_at_preflight": 0,
              "storage_objects_included": False,
              "rpo_rto": "Not defined by current project recovery configuration",
              "database_migration_applied": False,
              "restore_executed": False,
          }
          Path("recovery-evidence/restore-point-evidence.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps({
              "backup_type": manifest["backup_type"],
              "connection_mode": manifest["connection_mode"],
              "archive_integrity_verified": manifest["archive_integrity_verified"],
              "archive_toc_entries": manifest["archive_toc_entries"],
              "sha256": manifest["sha256"],
              "size_bytes": manifest["size_bytes"],
              "database_migration_applied": False,
              "restore_executed": False,
          }, indent=2))
          if manifest["archive_toc_entries"] < 1:
              raise SystemExit("Backup archive contains no table-of-contents entries.")
          PY

      - name: Resolve a server-only Supabase Storage backup key
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys?reveal=true" \
            -o /tmp/supabase-project-api-keys.json
          python - <<'PY'
          import json, os
          from pathlib import Path

          keys = json.loads(Path("/tmp/supabase-project-api-keys.json").read_text())
          if not isinstance(keys, list):
              raise SystemExit("Supabase Management API returned an unexpected API-key response.")
          selected = next((item for item in keys
                           if item.get("type") == "secret" and item.get("api_key")), None)
          if selected is None:
              selected = next((item for item in keys
                               if item.get("type") == "legacy"
                               and item.get("name") == "service_role"
                               and item.get("api_key")), None)
          if selected is None:
              raise SystemExit("No server-only Supabase Storage API key was returned.")
          key = selected["api_key"]
          key_type = selected["type"]
          print("::add-mask::" + key)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("SUPABASE_STORAGE_BACKUP_KEY=" + key + "\n")
              output.write("SUPABASE_STORAGE_BACKUP_KEY_TYPE=" + key_type + "\n")
          Path("/tmp/supabase-project-api-keys.json").unlink(missing_ok=True)
          print("Resolved a server-only Storage key without writing it to the artifact or logs.")
          PY

      - name: Capture canonical Supabase Storage buckets and object inventory
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            -e PGSSLMODE=require \
            postgres:17-alpine \
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc \
            "select coalesce(json_agg(json_build_object(
              'id',id,'name',name,'public',public,
              'file_size_limit',file_size_limit,'allowed_mime_types',allowed_mime_types
            ) order by id),'[]'::json)::text from storage.buckets" \
            > recovery-evidence/storage-buckets.json
          docker run --rm \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            -e PGSSLMODE=require \
            postgres:17-alpine \
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc \
            "select coalesce(json_agg(json_build_object(
              'bucket_id',o.bucket_id,'name',o.name,'owner_id',to_jsonb(o)->>'owner_id',
              'metadata',o.metadata,'created_at',o.created_at,'updated_at',o.updated_at
            ) order by o.bucket_id,o.name),'[]'::json)::text from storage.objects o" \
            > recovery-evidence/storage-inventory.json

      - name: Back up and checksum every Supabase Storage object
        shell: bash
        env:
          SUPABASE_URL: https://dvdziauyvuhcnqhrrrww.supabase.co
        run: |
          set -euo pipefail
          python tools/recovery/backup_supabase_storage.py \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --inventory recovery-evidence/storage-inventory.json \
            --buckets recovery-evidence/storage-buckets.json \
            --archive recovery-evidence/allpha-supabase-storage-pre-migration.tar \
            --manifest recovery-evidence/storage-backup-manifest.json \
            --evidence recovery-evidence/storage-backup-evidence.json

      - name: Merge Storage coverage into the pre-migration recovery manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          point_path = Path("recovery-evidence/restore-point-evidence.json")
          point = json.loads(point_path.read_text())
          storage = json.loads(Path("recovery-evidence/storage-backup-evidence.json").read_text())
          point.update(storage)
          point["storage_objects_included"] = True
          point["storage_backup_method"] = "authenticated Supabase Storage REST download; archive SHA-256 and per-object hashes verified"
          point["storage_restore_tested"] = False
          point_path.write_text(json.dumps(point, indent=2, sort_keys=True) + "\n")
          print(json.dumps({
              "storage_objects_included": point["storage_objects_included"],
              "storage_bucket_count": point["storage_bucket_count"],
              "storage_object_count": point["storage_object_count"],
              "storage_total_bytes": point["storage_total_bytes"],
              "storage_archive_sha256": point["storage_archive_sha256"],
          }, indent=2))
          PY

      - name: Upload pre-migration database and Storage backup with manifests
        uses: actions/upload-artifact@v4
        with:
          name: eng-p02-pre-migration-db-backup
          path: |
            recovery-evidence/allpha-p02-pre-migration.dump
            recovery-evidence/restore-point-evidence.json
            recovery-evidence/dump.toc
            recovery-evidence/allpha-supabase-storage-pre-migration.tar
            recovery-evidence/storage-buckets.json
            recovery-evidence/storage-inventory.json
            recovery-evidence/storage-backup-manifest.json
            recovery-evidence/storage-backup-evidence.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
