name: ENG-P02 Create Pre-Migration Database Backup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/eng-p02-create-restore-point.yml

permissions:
  contents: read

concurrency:
  group: eng-p02-pre-migration-restore-point
  cancel-in-progress: false

jobs:
  create-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: dvdziauyvuhcnqhrrvww
    steps:
      - name: Require canonical production credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is unavailable; cannot resolve the canonical Supavisor endpoint."
            exit 1
          fi
          if [[ -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "::error::SUPABASE_DB_PASSWORD is unavailable; no backup was created and no migration may be applied."
            exit 1
          fi
          test "$SUPABASE_PROJECT_ID" = "dvdziauyvuhcnqhrrvww"
          mkdir -p recovery-evidence

      - name: Resolve the IPv4 session pooler from Supabase Management API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/database/pooler" \
            -o /tmp/pooler-config.json
          python - <<'PY'
          import json, os
          from pathlib import Path

          data = json.loads(Path("/tmp/pooler-config.json").read_text())
          if isinstance(data, dict):
              data = [data]
          candidates = [
              item for item in data
              if str(item.get("pool_mode", "")).lower() == "session"
              and int(item.get("db_port") or 0) == 5432
          ]
          if not candidates:
              raise SystemExit("Supabase Management API did not return an IPv4 session pooler on port 5432.")
          pooler = candidates[0]
          values = {
              "DB_HOST": str(pooler.get("db_host") or "").strip(),
              "DB_PORT": str(pooler.get("db_port") or "").strip(),
              "DB_USER": str(pooler.get("db_user") or "").strip(),
              "DB_NAME": str(pooler.get("db_name") or "").strip(),
          }
          if not all(values.values()):
              raise SystemExit("Supavisor session pooler response omitted required connection fields.")
          if not values["DB_HOST"].endswith(".pooler.supabase.com"):
              raise SystemExit("Resolved host is not a Supavisor shared pooler; refusing to fall back to the IPv6 direct endpoint.")
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              for key, value in values.items():
                  env_file.write(f"{key}={value}\n")
          print(json.dumps({"pool_mode": "session", "db_host": values["DB_HOST"], "db_port": values["DB_PORT"], "db_user": values["DB_USER"], "db_name": values["DB_NAME"]}, indent=2))
          PY

      - name: Create a full PostgreSQL 17 logical backup
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            -e PGSSLMODE=require \
            -v "$PWD/recovery-evidence:/backup" \
            postgres:17-alpine \
            pg_dump \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --username="$DB_USER" \
              --dbname="$DB_NAME" \
              --no-owner \
              --no-privileges \
              --format=custom \
              --compress=6 \
              --file=/backup/allpha-p02-pre-migration.dump
          test -s recovery-evidence/allpha-p02-pre-migration.dump

      - name: Verify dump archive and generate sanitized backup manifest
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/recovery-evidence:/backup" \
            postgres:17-alpine \
            sh -lc 'pg_restore --list /backup/allpha-p02-pre-migration.dump > /backup/dump.toc'
          pg_dump_version="$(docker run --rm postgres:17-alpine pg_dump --version)"
          archive_entries="$(grep -c '^[0-9]' recovery-evidence/dump.toc || true)"
          dump_sha256="$(sha256sum recovery-evidence/allpha-p02-pre-migration.dump | awk '{print $1}')"
          dump_bytes="$(stat -c '%s' recovery-evidence/allpha-p02-pre-migration.dump)"
          server_version="$(docker run --rm \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            -e PGSSLMODE=require \
            postgres:17-alpine \
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc 'select version()')"
          export PG_DUMP_VERSION="$pg_dump_version"
          export ARCHIVE_ENTRIES="$archive_entries"
          export DUMP_SHA256="$dump_sha256"
          export DUMP_BYTES="$dump_bytes"
          export SERVER_VERSION="$server_version"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          manifest = {
              "project_ref": os.environ["SUPABASE_PROJECT_ID"],
              "database_host": os.environ["DB_HOST"],
              "database_port": int(os.environ["DB_PORT"]),
              "database_name": os.environ["DB_NAME"],
              "database_user": os.environ["DB_USER"],
              "database_server_version": os.environ["SERVER_VERSION"],
              "backup_type": "pg_dump_custom_full_database",
              "backup_file": "allpha-p02-pre-migration.dump",
              "pg_dump_version": os.environ["PG_DUMP_VERSION"],
              "archive_toc_entries": int(os.environ["ARCHIVE_ENTRIES"]),
              "sha256": os.environ["DUMP_SHA256"],
              "size_bytes": int(os.environ["DUMP_BYTES"]),
              "captured_at_utc": datetime.now(timezone.utc).isoformat(),
              "archive_integrity_verified": True,
              "restore_tested": False,
              "managed_restore_point_api": "unavailable on prior attempt (HTTP 400: endpoint unavailable)",
              "connection_mode": "Supavisor shared session pooler (IPv4)",
              "pitr_enabled_at_preflight": False,
              "automated_backup_count_at_preflight": 0,
              "storage_objects_included": False,
              "rpo_rto": "Not defined by current project recovery configuration",
              "database_migration_applied": False,
              "restore_executed": False,
          }
          Path("recovery-evidence/restore-point-evidence.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps({
              "backup_type": manifest["backup_type"],
              "connection_mode": manifest["connection_mode"],
              "archive_integrity_verified": manifest["archive_integrity_verified"],
              "archive_toc_entries": manifest["archive_toc_entries"],
              "sha256": manifest["sha256"],
              "size_bytes": manifest["size_bytes"],
              "database_migration_applied": False,
              "restore_executed": False,
          }, indent=2))
          if manifest["archive_toc_entries"] < 1:
              raise SystemExit("Backup archive contains no table-of-contents entries.")
          PY

      - name: Upload pre-migration database backup and manifest
        uses: actions/upload-artifact@v4
        with:
          name: eng-p02-pre-migration-db-backup
          path: |
            recovery-evidence/allpha-p02-pre-migration.dump
            recovery-evidence/restore-point-evidence.json
            recovery-evidence/dump.toc
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
