name: ENG-P02 Create Pre-Migration Restore Point

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/eng-p02-create-restore-point.yml

permissions:
  contents: read

concurrency:
  group: eng-p02-pre-migration-restore-point
  cancel-in-progress: false

jobs:
  create-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: dvdziauyvuhcnqhrrvww
      RESTORE_POINT_NAME: allpha-p02-20261123
    steps:
      - name: Require the existing Management API credential
        shell: bash
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is unavailable; no restore point was created."
            exit 1
          fi
          test "$SUPABASE_PROJECT_ID" = "dvdziauyvuhcnqhrrvww"

      - name: Check for an existing named restore point
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery-evidence
          status="$(curl --silent --show-error -o recovery-evidence/before.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/backups")"
          test "$status" = "200" || { echo "::error::Cannot inspect existing backups (HTTP $status)."; exit 1; }
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path("recovery-evidence/before.json").read_text())
          wanted=os.environ["RESTORE_POINT_NAME"]
          found=False
          def walk(value):
              global found
              if isinstance(value, dict):
                  if value.get("name") == wanted:
                      found=True
                  for child in value.values(): walk(child)
              elif isinstance(value, list):
                  for child in value: walk(child)
          walk(data)
          Path("recovery-evidence/existing.txt").write_text("true" if found else "false")
          print(json.dumps({"existing_restore_point":found,"name":wanted}))
          PY

      - name: Create the database restore point when absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(cat recovery-evidence/existing.txt)" == "true" ]]; then
            echo "Named restore point already exists; avoiding a duplicate."
            printf '%s\n' "existing" > recovery-evidence/create.status
            exit 0
          fi
          status="$(curl --silent --show-error -o recovery-evidence/create.raw.json -w '%{http_code}' \
            --request POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"$RESTORE_POINT_NAME\"}" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/backups/restore-point")"
          printf '%s\n' "$status" > recovery-evidence/create.status
          if [[ "$status" != "200" && "$status" != "201" ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          try:
              payload=json.loads(Path("recovery-evidence/create.raw.json").read_text())
          except Exception:
              payload={}
          print(json.dumps({
              "provider_error_code": payload.get("code") if isinstance(payload,dict) else None,
              "provider_error_message": payload.get("message") if isinstance(payload,dict) else None,
              "raw_response": "withheld",
          }, indent=2))
          PY
            echo "::error::Supabase did not create the requested restore point (HTTP $status). No database migration was applied."
            exit 1
          fi

      - name: Verify the named restore point and save sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error -o recovery-evidence/after.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/backups")"
          test "$status" = "200" || { echo "::error::Cannot verify backup inventory after restore-point creation (HTTP $status)."; exit 1; }
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          root=Path("recovery-evidence")
          wanted=os.environ["RESTORE_POINT_NAME"]
          sensitive=("url","uri","token","secret","password","credential","connection","key","path")
          def redact(value):
              if isinstance(value,dict):
                  return {str(k):("<redacted>" if any(x in str(k).lower() for x in sensitive) else redact(v)) for k,v in value.items()}
              if isinstance(value,list): return [redact(x) for x in value]
              return value
          before=json.loads((root/"before.json").read_text())
          after=json.loads((root/"after.json").read_text())
          created=(root/"create.status").read_text().strip()
          def contains(value):
              if isinstance(value,dict):
                  if value.get("name")==wanted: return True
                  return any(contains(v) for v in value.values())
              if isinstance(value,list): return any(contains(v) for v in value)
              return False
          verified=contains(after)
          response={}
          raw=root/"create.raw.json"
          if raw.exists():
              try: response=redact(json.loads(raw.read_text()))
              except Exception: response={"response":"unparseable; raw body intentionally omitted"}
          record={
              "project_ref":"dvdziauyvuhcnqhrrvww",
              "restore_point_name":wanted,
              "captured_at_utc":datetime.now(timezone.utc).isoformat(),
              "creation_result":created,
              "restore_point_listed_after_creation":verified,
              "before_backup_inventory":redact(before),
              "after_backup_inventory":redact(after),
              "create_response":response,
              "database_migration_applied":False,
              "restore_executed":False,
          }
          (root/"restore-point-evidence.json").write_text(json.dumps(record,indent=2))
          print(json.dumps({
              "restore_point_name":wanted,
              "creation_result":created,
              "restore_point_listed_after_creation":verified,
              "database_migration_applied":False,
              "restore_executed":False,
          },indent=2))
          if created not in ("200","201","existing"):
              raise SystemExit("Restore-point creation did not return an accepted result.")
          if not verified and created != "existing":
              raise SystemExit("Restore point was not visible in the post-creation backup inventory; do not apply DDL.")
          PY

      - name: Upload sanitized restore-point evidence
        uses: actions/upload-artifact@v4
        with:
          name: eng-p02-pre-migration-restore-point
          path: recovery-evidence/restore-point-evidence.json
          if-no-files-found: error
          retention-days: 30
