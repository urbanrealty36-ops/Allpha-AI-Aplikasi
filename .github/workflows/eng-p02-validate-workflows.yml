name: ENG-P02 Validate Recovery and Migration Workflows

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eng-p02-*.yml"
      - ".github/workflows/eng-p03-*.yml"
      - "apps/api/supabase/migrations/20261123191600_eng_p03_account_export_and_deletion_request_lifecycle.sql"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate ENG-P02 workflow syntax and expressions
        run: |
          "$(go env GOPATH)/bin/actionlint" -color \
            .github/workflows/eng-p02-create-restore-point.yml \
            .github/workflows/eng-p02-backup-restore-verification.yml \
            .github/workflows/eng-p02-apply-forward-migration.yml \
            .github/workflows/eng-p03-apply-account-lifecycle-migration.yml
