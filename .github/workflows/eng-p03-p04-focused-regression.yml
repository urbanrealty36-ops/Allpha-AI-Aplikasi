name: ENG-P03 P04 Focused Lifecycle and Social Graph Regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eng-p03-p04-focused-regression.yml"
      - "apps/api/src/allpha_api/main.py"
      - "apps/api/src/allpha_api/account_lifecycle_api.py"
      - "apps/api/src/allpha_api/account_lifecycle_governance_api.py"
      - "apps/api/src/allpha_api/account_lifecycle_worker.py"
      - "apps/super-admin/app/AccountLifecycleGovernancePanel.tsx"
      - "apps/api/supabase/migrations/20261123173919_eng_p03_account_deletion_ownership_transfers.sql"
      - "apps/api/supabase/migrations/20261123174325_eng_p03_account_deletion_attribution_anonymization.sql"
      - "apps/api/supabase/migrations/20261123174529_eng_p03_cinema_conversation_spatial_anonymization.sql"
      - "apps/api/supabase/migrations/20261123180112_eng_p03_identity_tombstones_and_provider_cancellation.sql"
      - "apps/api/supabase/migrations/20261123180725_eng_p03_executor_referential_integrity_hardening.sql"
      - "apps/api/supabase/migrations/20261123181359_eng_p03_billing_stripe_environment_binding.sql"
      - "apps/api/supabase/migrations/20261123181531_eng_p03_legacy_billing_order_rpc_guard.sql"
      - "apps/api/supabase/migrations/20261123182248_eng_p03_governance_policy_gate_and_retry.sql"
      - "apps/api/src/allpha_api/stripe_billing_api.py"
      - "apps/api/tests/test_account_lifecycle_api.py"
      - "apps/api/tests/test_account_lifecycle_governance_api.py"
      - "apps/api/tests/test_eng_p03_account_deletion_disposition_migration_contract.py"
      - "apps/web/app/account/AccountDataLifecyclePanel.tsx"
      - "apps/client/components/AccountDataLifecycleScreen.tsx"
      - "apps/api/supabase/migrations/20261123125248_eng_p03_account_export_progress.sql"
      - "apps/api/tests/test_account_lifecycle_worker_progress.py"
      - "apps/api/tests/test_eng_p03_account_export_progress_migration_contract.py"
      - "apps/api/src/allpha_api/social_graph_api.py"
      - "apps/api/src/allpha_api/interest_graph_api.py"
      - "apps/api/src/allpha_api/feed_api.py"
      - "apps/client/App.tsx"
      - "apps/api/src/allpha_api/recommendation_engine.py"
      - "apps/api/tests/test_account_lifecycle_worker.py"
      - "apps/api/tests/test_account_lifecycle_worker_lifespan.py"
      - "apps/api/tests/test_eng_p03_interest_graph_export_migration_contract.py"
      - "apps/api/supabase/migrations/20261123124933_eng_p03_export_interest_graph_sources.sql"
      - "apps/api/supabase/migrations/20261123140636_eng_p03_p04_private_registry_rls.sql"
      - "apps/api/tests/test_eng_p03_p04_private_registry_rls_migration_contract.py"
      - "apps/api/tests/test_social_graph_polymorphic_api.py"
      - "apps/api/tests/test_social_feed_api.py"
      - "apps/api/tests/test_interest_graph_api.py"
      - "apps/api/tests/test_recommendation_engine.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eng-p03-p04-focused-regression
  cancel-in-progress: false

jobs:
  api-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install canonical API test dependencies
        run: python -m pip install -e "./apps/api[dev]"

      - name: Run focused ENG-P03 and ENG-P04 regression suite
        working-directory: apps/api
        run: |
          python -m pytest \
            tests/test_account_lifecycle_api.py \
            tests/test_account_lifecycle_governance_api.py \
            tests/test_eng_p03_account_deletion_disposition_migration_contract.py \
            tests/test_account_lifecycle_worker.py \
            tests/test_account_lifecycle_worker_lifespan.py \
            tests/test_account_lifecycle_worker_progress.py \
            tests/test_eng_p03_account_export_progress_migration_contract.py \
            tests/test_eng_p03_interest_graph_export_migration_contract.py \
            tests/test_eng_p03_p04_private_registry_rls_migration_contract.py \
            tests/test_interest_graph_api.py \
            tests/test_recommendation_engine.py \
            tests/test_social_graph_polymorphic_api.py \
            tests/test_social_feed_api.py \
            tests/test_eng_p04_interest_ontology_migration_contract.py \
            tests/test_eng_p04_privacy_migration_contract.py \
            -q
