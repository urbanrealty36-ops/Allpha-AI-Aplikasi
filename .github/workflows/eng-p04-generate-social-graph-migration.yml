name: ENG-P04 Generate Social Graph Grant Migration

on:
  push:
    branches:
      - work/wp02-engp04-evidence-20261027
    paths:
      - "docs/PHASES/ENG-P04_SOCIAL_GRAPH_GRANT_REPAIR_DRAFT.sql"
  pull_request:
    branches:
      - main
    paths:
      - "docs/PHASES/ENG-P04_SOCIAL_GRAPH_GRANT_REPAIR_DRAFT.sql"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eng-p04-generate-social-graph-migration
  cancel-in-progress: false

jobs:
  generate:
    name: Generate migration using Supabase CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3

      - name: Generate migration using CLI
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new --help
          test -d supabase/migrations
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_eng_p04_social_graph_least_privilege_grants.sql' -print | sort | tail -n 1)"
          if [ -z "$migration_file" ]; then
            supabase migration new eng_p04_social_graph_least_privilege_grants
            migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_eng_p04_social_graph_least_privilege_grants.sql' -print | sort | tail -n 1)"
            test -n "$migration_file"
            python - "$migration_file" <<'PY'
          from pathlib import Path
          import sys

          target = Path(sys.argv[1])
          draft = Path("../../docs/PHASES/ENG-P04_SOCIAL_GRAPH_GRANT_REPAIR_DRAFT.sql")
          text = draft.read_text()
          old_header = (
              "-- DESIGN DRAFT ONLY — NOT A SUPABASE MIGRATION.\n"
              "-- Do not apply this file to any database.\n"
              "-- Generate the real migration with `supabase migration new <descriptive-name>`,\n"
              "-- copy this reviewed SQL into that generated file, then run the approved\n"
              "-- non-production validation and security-advisor process before any apply.\n"
          )
          if not text.startswith(old_header):
              raise SystemExit("Draft header changed; refusing to generate the migration from an unreviewed source.")
          sql = (
              "-- ENG-P04 forward migration generated by Supabase CLI.\n"
              "-- Removes excessive Social Graph grants while preserving current RLS policies.\n"
              "-- Source: docs/PHASES/ENG-P04_SOCIAL_GRAPH_GRANT_REPAIR_DRAFT.sql\n"
              "-- Do not apply to production until the approved review and validation gates pass.\n"
              + text[len(old_header):]
          )
          target.write_text(sql)
          print(f"Generated migration SQL at {target}")
          PY
          else
            echo "Found existing CLI-generated migration: $migration_file"
          fi
          python - <<'PY'
          from pathlib import Path
          matches = list(Path("supabase/migrations").glob("*_eng_p04_social_graph_least_privilege_grants.sql"))
          assert len(matches) == 1, f"Expected exactly one generated migration, got {len(matches)}"
          sql = " ".join(matches[0].read_text().lower().split())
          for required in (
              "revoke all privileges on table public.social_edges from public, anon, authenticated",
              "revoke all privileges on table public.user_interests from public, anon, authenticated",
              "grant update (status) on table public.social_edges to authenticated",
              "grant insert (user_id, interest_key, preference)",
              "grant update (user_id, interest_key, preference)",
          ):
              assert required in sql, f"Missing required grant contract: {required}"
          assert "grant truncate" not in sql
          assert "alter default privileges" not in sql
          PY

      - name: Verify source migration contract
        working-directory: apps/api
        run: python -m pytest tests/test_eng_p04_privacy_migration_contract.py -q

      - name: Commit generated migration to the same working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/supabase/migrations/*_eng_p04_social_graph_least_privilege_grants.sql
          if git diff --cached --quiet; then
            echo "No generated migration changes to commit."
            exit 1
          fi
          git commit -m "db: generate ENG-P04 Social Graph least-privilege migration"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
