name: ENG-P21 Spatial Governance Tests

on:
  push:
    branches: [main]
    paths:
      - "apps/api/src/allpha_api/spatial_governance_api.py"
      - "apps/api/src/allpha_api/operator_security.py"
      - "apps/api/tests/test_spatial_governance_api.py"
      - "apps/api/tests/test_spatial_navigation_api.py"
      - "apps/api/supabase/migrations/*eng_p21*"
      - ".github/workflows/eng-p21-spatial-governance-tests.yml"
  pull_request:
    paths:
      - "apps/api/src/allpha_api/spatial_governance_api.py"
      - "apps/api/src/allpha_api/operator_security.py"
      - "apps/api/tests/test_spatial_governance_api.py"
      - "apps/api/tests/test_spatial_navigation_api.py"
      - "apps/api/supabase/migrations/*eng_p21*"
      - ".github/workflows/eng-p21-spatial-governance-tests.yml"

permissions:
  contents: read

jobs:
  spatial-governance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_spatial_governance_api.py tests/test_spatial_navigation_api.py
