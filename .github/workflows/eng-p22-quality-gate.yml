name: ENG-P22 Spatial and Production Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/super-admin/**"
      - "apps/client/**"
      - "tools/3d-assets/**"
      - "docs/PHASES/**"
      - ".github/workflows/eng-p22-quality-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/super-admin/**"
      - "apps/client/**"
      - "tools/3d-assets/**"
      - "docs/PHASES/**"
      - ".github/workflows/eng-p22-quality-gate.yml"

permissions:
  contents: read

concurrency:
  group: eng-p22-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: FastAPI tests (ENG-P21/P22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run spatial governance and Theme Builder tests
        run: python -m pytest tests/test_spatial_governance_api.py tests/test_spatial_theme_api.py

  web-quality:
    name: Web typecheck, lint, smoke and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  admin-quality:
    name: Super Admin typecheck, lint, smoke and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/super-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/super-admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  native-spatial-quality:
    name: Native renderer and app smoke checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
