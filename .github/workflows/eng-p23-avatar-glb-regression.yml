name: ENG-P23 Avatar GLB Regression

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/eng-p23-avatar-glb-regression.yml"
      - "tools/3d-assets/verify_avatar_fixture.py"
      - "apps/web/lib/spatial/configureAllphaGLTFLoader.ts"
      - "apps/client/lib/spatial/configureAllphaGLTFLoader.ts"
      - "apps/web/scripts/spatial-glb-regression.mjs"
      - "apps/client/scripts/spatial-glb-regression.mjs"

permissions:
  contents: read

concurrency:
  group: eng-p23-avatar-glb-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.fixture.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Acquire one per-model MIT character and validate GLB structure
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          python tools/3d-assets/verify_avatar_fixture.py --out-dir .artifacts/avatar-fixture
          SHA="$(python -c "import json; print(json.load(open('.artifacts/avatar-fixture/fixture-report.json'))['sha256'])")"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
      - name: Upload fixture acquisition diagnostics (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eng-p23-avatar-fixture-${{ github.run_id }}
          path: .artifacts/avatar-fixture/
          if-no-files-found: error
          retention-days: 30

  web-native-regression:
    needs: fixture-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: eng-p23-avatar-fixture-${{ github.run_id }}
          path: .artifacts/avatar-fixture
      - name: Verify fixture bytes remain identical
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ needs.fixture-integrity.outputs.sha256 }}  .artifacts/avatar-fixture/avatar.glb" | sha256sum --check
      - name: Web real meshopt decoding regression and build
        working-directory: apps/web
        run: |
          npm ci
          node scripts/spatial-glb-regression.mjs ../../.artifacts/avatar-fixture/avatar.glb
          npm test
          npm run typecheck
          npm run build
      - name: Native real meshopt decoding regression and platform exports
        working-directory: apps/client
        run: |
          npm ci
          node scripts/spatial-glb-regression.mjs ../../.artifacts/avatar-fixture/avatar.glb
          npm test
          npm run typecheck
          npx expo export --platform android
          npx expo export --platform ios
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eng-p23-avatar-regression-evidence-${{ github.run_id }}
          path: |
            .artifacts/avatar-fixture/fixture-report.json
            .artifacts/avatar-fixture/license-metadata.json
            apps/web/.artifacts/spatial-regression.json
            apps/client/.artifacts/spatial-regression.json
          if-no-files-found: warn
          retention-days: 30
