name: ENG-P23 Avatar GLB Regression

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub Actions run ID containing the retained GLB acquisition shards"
        required: true
        default: "39002086145"
  workflow_run:
    workflows: ["ENG-P22 Production Private GLB Ingest"]
    types: [completed]
  push:
    paths:
      - ".github/workflows/eng-p23-avatar-glb-regression.yml"
      - "apps/web/lib/spatial/configureAllphaGLTFLoader.ts"
      - "apps/client/lib/spatial/configureAllphaGLTFLoader.ts"
      - "apps/web/scripts/spatial-glb-regression.mjs"
      - "apps/web/scripts/spatial-gltfloader-parse.mjs"
      - "apps/web/scripts/spatial-browser-visual-regression.mjs"
      - "tools/3d-assets/browser-glb-visual-test.html"
      - "apps/client/scripts/spatial-glb-regression.mjs"
      - "apps/client/SpatialRendererDeviceHarness.tsx"
      - "tools/3d-assets/run-spatial-device-android.sh"
      - "tools/3d-assets/meshopt-fallback-compat.mjs"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  # Isolate each device acceptance attempt so evidence runs cannot collide.
  group: eng-p23-avatar-glb-regression-v7-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  acquired-avatar-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '39002086145' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download actual acquisition shards from the source run
        uses: actions/download-artifact@v4
        with:
          name: allpha-glb-acquisition-shard-01
          path: .artifacts/acquired/shard-01
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: allpha-glb-acquisition-shard-02
          path: .artifacts/acquired/shard-02
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: allpha-glb-acquisition-shard-03
          path: .artifacts/acquired/shard-03
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: allpha-glb-acquisition-shard-04
          path: .artifacts/acquired/shard-04
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: allpha-glb-acquisition-reconciliation
          path: .artifacts/acquired/reconciliation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Resolve actual avatar files from source manifest
        id: avatar-files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          root = Path.cwd()
          manifest = root / ".artifacts/acquired/reconciliation/manifest.csv"
          if not manifest.exists():
              raise SystemExit(f"missing acquisition manifest: {manifest}")
          files = []
          with manifest.open(encoding="utf-8-sig", newline="") as stream:
              for row in csv.DictReader(stream):
                  if row.get("repo") != "c-frame/valid-avatars-glb" or row.get("status") != "DOWNLOADED":
                      continue
                  rel = row.get("local_file", "")
                  candidates = list((root / ".artifacts/acquired").glob(f"shard-*/{rel}"))
                  if len(candidates) == 1:
                      files.append(str(candidates[0].resolve()))
          files = sorted(set(files))
          if len(files) != 232:
              raise SystemExit(f"expected 232 physical acquired avatar GLBs, found {len(files)}")
          out = root / ".artifacts/acquired/avatar-files.txt"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n".join(files) + "\n", encoding="utf-8")
          print(json.dumps({"source_run_id": os.environ["SOURCE_RUN_ID"], "actual_avatar_files": len(files), "manifest": str(manifest)}, indent=2))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright and Chromium for real texture/WebGL regression
        working-directory: apps/web
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Parse real acquired avatar geometry through Three GLTFLoader
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p .artifacts/acquired/results/gltfloader-parse
          failed=0
          while IFS= read -r file; do
            name="$(basename "$file" .glb)"
            if (cd apps/web && node scripts/spatial-gltfloader-parse.mjs "$file") > ".artifacts/acquired/results/gltfloader-parse/$name.log" 2>&1; then
              cp "apps/web/.artifacts/gltfloader-parse/$name.json" ".artifacts/acquired/results/gltfloader-parse/$name.json"
            else
              failed=$((failed + 1))
              printf '{"asset":"%s","status":"failed","log":"%s.log"}\n' "$name" "$name" > ".artifacts/acquired/results/gltfloader-parse/$name.failure.json"
            fi
          done < .artifacts/acquired/avatar-files.txt
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path(".artifacts/acquired/results/gltfloader-parse")
          reports=[p for p in base.glob("*.json") if not p.name.endswith(".failure.json")]
          failures=list(base.glob("*.failure.json"))
          parsed=sum(int(json.loads(p.read_text()).get("meshCount",0)) for p in reports)
          skinned=sum(int(json.loads(p.read_text()).get("skinnedMeshCount",0)) for p in reports)
          summary={"test":"Three.js GLTFLoader parse of actual acquired avatar GLBs","passed_assets":len(reports),"failed_assets":len(failures),"parsed_mesh_nodes":parsed,"assets_with_skinned_mesh":skinned,"scope":"geometry/skin parse after stripping materials/images only in memory; not texture decode, GPU render, or device acceptance"}
          (base/"summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          if failures: raise SystemExit(1)
          PY
      - name: Run all acquired avatars through browser texture decode and WebGL frame
        continue-on-error: true
        run: node apps/web/scripts/spatial-browser-visual-regression.mjs .artifacts/acquired/avatar-files.txt .artifacts/acquired/results/browser-visual
      - name: Run Web Meshopt decoder on all acquired avatar GLBs
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p .artifacts/acquired/results/web
          failed=0
          while IFS= read -r file; do
            name="$(basename "$file" .glb)"
            if (cd apps/web && node scripts/spatial-glb-regression.mjs "$file") > ".artifacts/acquired/results/web/$name.log" 2>&1; then
              cp apps/web/.artifacts/spatial-regression.json ".artifacts/acquired/results/web/$name.json"
            else
              failed=$((failed + 1))
              printf '{"asset":"%s","status":"failed","log":"%s.log"}\n' "$name" "$name" > ".artifacts/acquired/results/web/$name.failure.json"
            fi
          done < .artifacts/acquired/avatar-files.txt
          echo "web_failures=$failed" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path(".artifacts/acquired/results/web")
          reports=list(base.glob("*.json"))
          failures=list(base.glob("*.failure.json"))
          decoded=sum(int(json.loads(p.read_text()).get("decodedBufferViews",0)) for p in reports if not p.name.endswith(".failure.json"))
          summary={"platform":"web-node-meshopt-decoder","passed_assets":len(reports)-len(failures),"failed_assets":len(failures),"decoded_buffer_views":decoded,"scope":"decoder only; not GLTFLoader parse, texture decode, GPU render, or device acceptance"}
          (base/"summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          if failures: raise SystemExit(1)
          PY
      - name: Install Native dependencies
        working-directory: apps/client
        run: npm ci
      - name: Run Native Meshopt decoder on all acquired avatar GLBs
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p .artifacts/acquired/results/native
          failed=0
          while IFS= read -r file; do
            name="$(basename "$file" .glb)"
            if (cd apps/client && node scripts/spatial-glb-regression.mjs "$file") > ".artifacts/acquired/results/native/$name.log" 2>&1; then
              cp apps/client/.artifacts/spatial-regression.json ".artifacts/acquired/results/native/$name.json"
            else
              failed=$((failed + 1))
              printf '{"asset":"%s","status":"failed","log":"%s.log"}\n' "$name" "$name" > ".artifacts/acquired/results/native/$name.failure.json"
            fi
          done < .artifacts/acquired/avatar-files.txt
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path(".artifacts/acquired/results/native")
          reports=list(base.glob("*.json"))
          failures=list(base.glob("*.failure.json"))
          decoded=sum(int(json.loads(p.read_text()).get("decodedBufferViews",0)) for p in reports if not p.name.endswith(".failure.json"))
          summary={"platform":"native-node-meshopt-decoder","passed_assets":len(reports)-len(failures),"failed_assets":len(failures),"decoded_buffer_views":decoded,"scope":"decoder only; not GLTFLoader parse, texture decode, GPU render, or device acceptance"}
          (base/"summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          if failures: raise SystemExit(1)
          PY
      - name: Enforce actual-asset regression acceptance gate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(".artifacts/acquired/results")
          expected=["gltfloader-parse/summary.json","browser-visual/summary.json","web/summary.json","native/summary.json"]
          failures=[]
          for rel in expected:
              p=root/rel
              if not p.exists():
                  failures.append({"test":rel,"error":"summary missing"})
                  continue
              data=json.loads(p.read_text())
              count=data.get("failed_assets")
              if count is None:
                  count=data.get("failed",0)
              print(json.dumps({"test":rel,"summary":data},indent=2))
              if count != 0:
                  failures.append({"test":rel,"failed_assets":count})
          if failures:
              print(json.dumps({"acceptance":"FAIL","failures":failures},indent=2))
              sys.exit(1)
          print(json.dumps({"acceptance":"PASS","scope":"232 actual avatars: GLTFLoader geometry/skin, browser texture/WebGL, Web decoder, Native decoder. Physical Android/iOS performance remains separate."},indent=2))
          PY
      - name: Upload actual acquired avatar regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eng-p23-acquired-avatar-regression-${{ github.run_id }}
          path: .artifacts/acquired/results/
          if-no-files-found: error
          retention-days: 30


  android-emulator-render:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: allpha-glb-acquisition-shard-02
          path: .artifacts/device-fixture/shard-02
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '39002086145' }}
      - uses: actions/download-artifact@v4
        with:
          name: allpha-glb-acquisition-reconciliation
          path: .artifacts/device-fixture/reconciliation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '39002086145' }}
      - name: Confirm test fixture provenance and quarantine state
        run: |
          python3 - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          root=Path.cwd()
          rel="assets/0f734592f79d_AIAN_F_2_Busi.glb"
          manifest=root/".artifacts/device-fixture/reconciliation/manifest.csv"
          with manifest.open(encoding="utf-8-sig",newline="") as f:
              rows=[r for r in csv.DictReader(f) if r.get("local_file")==rel and r.get("repo")=="c-frame/valid-avatars-glb" and r.get("status")=="DOWNLOADED"]
          if len(rows)!=1: raise SystemExit(f"expected exactly one manifest row for test-only fixture, got {len(rows)}")
          row=rows[0]
          file=root/".artifacts/device-fixture/shard-02"/rel
          if not file.is_file(): raise SystemExit(f"missing fixture file: {file}")
          digest=hashlib.sha256(file.read_bytes()).hexdigest()
          if digest!=row["sha256"]: raise SystemExit("fixture SHA-256 differs from source manifest")
          report={"file":rel,"sha256":digest,"source_repo":row["repo"],"license_evidence":row["license"],"review_status":row["review"],"purpose":"isolated test fixture only; no approval or publication"}
          Path(".artifacts/device-fixture/fixture-provenance.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Install Native dependencies
        working-directory: apps/client
        run: npm ci
      - name: Fetch TEST_ONLY signed asset URL from canonical production manifest
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('allpha-spatial-ingest');
            const sceneKey = 'test-glb-0f734592f79df5772dfabad3361b12d29f7a911f';
            const response = await fetch('https://api.allpha.web.id/v1/spatial/test/scenes/' + sceneKey + '/manifest', {
              headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' },
              cache: 'no-store'
            });
            const manifest = await response.json();
            if (!response.ok) throw new Error('TEST_ONLY manifest unavailable; HTTP ' + response.status + ', code ' + (manifest.error?.code || 'unknown'));
            const object = (manifest.objects || [])[0];
            if (!object || object.sha256 !== '0f734592f79df5772dfabad3361b12d29f7a911ff86ea59adc51486a0d128320' ||
                Number(object.byte_size) !== 2084112 || object.publication_status !== 'test_only' ||
                object.category !== 'agent-character' || !object.asset_url?.startsWith('https://')) {
              throw new Error('TEST_ONLY manifest did not match the pinned quarantined fixture contract');
            }
            // Independently download the short-lived signed URL and verify exact bytes
            // before either native renderer is allowed to use the fixture.
            const bytesResponse = await fetch(object.asset_url, { cache: 'no-store' });
            if (!bytesResponse.ok) throw new Error('Signed asset download failed with HTTP ' + bytesResponse.status);
            const bytes = Buffer.from(await bytesResponse.arrayBuffer());
            const actualSha256 = require('node:crypto').createHash('sha256').update(bytes).digest('hex');
            if (actualSha256 !== object.sha256 || bytes.length !== Number(object.byte_size)) {
              throw new Error('Signed asset byte verification failed: sha256=' + actualSha256 + ', bytes=' + bytes.length);
            }
            core.exportVariable('EXPO_PUBLIC_SPATIAL_TEST_ASSET_URL', object.asset_url);
            core.info(JSON.stringify({ scene_key: sceneKey, expected_sha256: object.sha256, actual_sha256: actualSha256, expected_byte_size: Number(object.byte_size), actual_byte_size: bytes.length, byte_verification: 'PASS', category: object.category, lifecycle: object.publication_status, signed_url: 'obtained; redacted' }));
      - name: Build Android release APK before booting emulator
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/client && ./node_modules/.bin/expo prebuild --platform android --no-install)
          (cd apps/client/android && ./gradlew assembleRelease)
      - name: Build and run actual React Native renderer on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash tools/3d-assets/run-spatial-device-android.sh
      - name: Upload Android device regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eng-p23-android-device-${{ github.run_id }}
          path: .artifacts/device-fixture/results/android/
          if-no-files-found: warn
          retention-days: 30

  ios-simulator-render:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: allpha-glb-acquisition-shard-02
          path: .artifacts/device-fixture/shard-02
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '39002086145' }}
      - uses: actions/download-artifact@v4
        with:
          name: allpha-glb-acquisition-reconciliation
          path: .artifacts/device-fixture/reconciliation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '39002086145' }}
      - name: Confirm test fixture provenance and quarantine state
        run: |
          python3 - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          root=Path.cwd()
          rel="assets/0f734592f79d_AIAN_F_2_Busi.glb"
          with (root/".artifacts/device-fixture/reconciliation/manifest.csv").open(encoding="utf-8-sig",newline="") as f:
              rows=[r for r in csv.DictReader(f) if r.get("local_file")==rel and r.get("repo")=="c-frame/valid-avatars-glb" and r.get("status")=="DOWNLOADED"]
          if len(rows)!=1: raise SystemExit(f"expected exactly one manifest row for test-only fixture, got {len(rows)}")
          row=rows[0]; file=root/".artifacts/device-fixture/shard-02"/rel
          if not file.is_file(): raise SystemExit(f"missing fixture file: {file}")
          digest=hashlib.sha256(file.read_bytes()).hexdigest()
          if digest!=row["sha256"]: raise SystemExit("fixture SHA-256 differs from source manifest")
          Path(".artifacts/device-fixture/fixture-provenance.json").write_text(json.dumps({"file":rel,"sha256":digest,"source_repo":row["repo"],"license_evidence":row["license"],"review_status":row["review"],"purpose":"isolated test fixture only; no approval or publication"},indent=2))
          print(json.dumps({"file":rel,"sha256":digest,"review_status":row["review"],"purpose":"isolated test fixture only"},indent=2))
          PY
      - name: Install Native dependencies
        working-directory: apps/client
        run: npm ci
      - name: Fetch TEST_ONLY signed asset URL from canonical production manifest
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('allpha-spatial-ingest');
            const sceneKey = 'test-glb-0f734592f79df5772dfabad3361b12d29f7a911f';
            const response = await fetch('https://api.allpha.web.id/v1/spatial/test/scenes/' + sceneKey + '/manifest', {
              headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' },
              cache: 'no-store'
            });
            const manifest = await response.json();
            if (!response.ok) throw new Error('TEST_ONLY manifest unavailable; HTTP ' + response.status + ', code ' + (manifest.error?.code || 'unknown'));
            const object = (manifest.objects || [])[0];
            if (!object || object.sha256 !== '0f734592f79df5772dfabad3361b12d29f7a911ff86ea59adc51486a0d128320' ||
                Number(object.byte_size) !== 2084112 || object.publication_status !== 'test_only' ||
                object.category !== 'agent-character' || !object.asset_url?.startsWith('https://')) {
              throw new Error('TEST_ONLY manifest did not match the pinned quarantined fixture contract');
            }
            // Independently download the short-lived signed URL and verify exact bytes
            // before either native renderer is allowed to use the fixture.
            const bytesResponse = await fetch(object.asset_url, { cache: 'no-store' });
            if (!bytesResponse.ok) throw new Error('Signed asset download failed with HTTP ' + bytesResponse.status);
            const bytes = Buffer.from(await bytesResponse.arrayBuffer());
            const actualSha256 = require('node:crypto').createHash('sha256').update(bytes).digest('hex');
            if (actualSha256 !== object.sha256 || bytes.length !== Number(object.byte_size)) {
              throw new Error('Signed asset byte verification failed: sha256=' + actualSha256 + ', bytes=' + bytes.length);
            }
            core.exportVariable('EXPO_PUBLIC_SPATIAL_TEST_ASSET_URL', object.asset_url);
            core.info(JSON.stringify({ scene_key: sceneKey, expected_sha256: object.sha256, actual_sha256: actualSha256, expected_byte_size: Number(object.byte_size), actual_byte_size: bytes.length, byte_verification: 'PASS', category: object.category, lifecycle: object.publication_status, signed_url: 'obtained; redacted' }));
      - name: Prepare isolated test app
        shell: bash
        run: |
          set -euo pipefail
          cp apps/client/SpatialRendererDeviceHarness.tsx apps/client/App.tsx
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("apps/client/app.json")
          d=json.loads(p.read_text())
          ios=d.setdefault("expo",{}).setdefault("ios",{})
          info=ios.setdefault("infoPlist",{})
          info.setdefault("NSAppTransportSecurity",{})["NSAllowsArbitraryLoads"]=False
          p.write_text(json.dumps(d,indent=2)+"\n")
          PY
      - name: Build and run actual React Native renderer on iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/device-fixture/results/ios
          UDID="$(xcrun simctl list devices available | sed -nE 's/.*iPhone (16|15)[^()]* \(([0-9A-F-]{36})\).*/\2/p' | head -n 1)"
          if [ -z "$UDID" ]; then echo "No supported iPhone 15/16 simulator found"; xcrun simctl list devices available; exit 1; fi
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          # Run the repository-local Expo CLI from the actual native app root.
          # This CLI version does not accept --project-dir on prebuild/run commands.
          (cd apps/client && ./node_modules/.bin/expo prebuild --platform ios --no-install)
          # Expo/Metro runtime exceptions are emitted on the runner process, not reliably in simctl logs.
          (cd apps/client && ./node_modules/.bin/expo run:ios --configuration Release --device "$UDID") > .artifacts/device-fixture/results/ios/expo-run.log 2>&1 &
          expo_pid=$!
          passed=0
          for i in $(seq 1 900); do
            device_logs="$(xcrun simctl spawn "$UDID" log show --last 2m --style compact 2>/dev/null || true)"
            metro_logs="$(cat .artifacts/device-fixture/results/ios/expo-run.log 2>/dev/null || true)"
            logs="${device_logs}\n${metro_logs}"
            if [[ "$logs" == *"SPATIAL_DEVICE_TEST_RESULT:PASS"* ]]; then
              printf "%s\n%s\n" "$device_logs" "$metro_logs" > .artifacts/device-fixture/results/ios/simulator.log
              passed=1
              break
            fi
            if grep -Eqi "SPATIAL_DEVICE_TEST_RESULT:FAIL|Could not load|Cannot read property .* of undefined|TypeError:|SPATIAL_DEVICE_BOUNDARY_ERROR" <<< "$logs"; then
              echo "$device_logs" > .artifacts/device-fixture/results/ios/simulator.log
              xcrun simctl spawn "$UDID" log show --last 5m --style compact > .artifacts/device-fixture/results/ios/simulator-full.log 2>&1 || true
              xcrun simctl io "$UDID" screenshot .artifacts/device-fixture/results/ios/failure.png || true
              cat .artifacts/device-fixture/results/ios/expo-run.log
              cat .artifacts/device-fixture/results/ios/simulator-full.log
              exit 1
            fi
            if ! kill -0 "$expo_pid" 2>/dev/null; then
              echo "Expo process exited before renderer PASS"
              cat .artifacts/device-fixture/results/ios/expo-run.log
              exit 1
            fi
            sleep 3
          done
          if [ "$passed" -ne 1 ]; then
            echo "iOS renderer did not report PASS within 45 minutes"
            xcrun simctl spawn "$UDID" log show --last 5m --style compact > .artifacts/device-fixture/results/ios/simulator-full.log 2>&1 || true
            cat .artifacts/device-fixture/results/ios/expo-run.log
            cat .artifacts/device-fixture/results/ios/simulator-full.log
            exit 1
          fi
          xcrun simctl io "$UDID" screenshot .artifacts/device-fixture/results/ios/render.png
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          root=Path(".artifacts/device-fixture/results/ios")
          log=(root/"simulator.log").read_text(errors="replace")
          image=(root/"render.png").read_bytes()
          if "SPATIAL_DEVICE_TEST_RESULT:PASS" not in log:
              raise SystemExit("iOS PASS marker missing from retained simulator log")
          if len(image)<1024 or image[:8]!=b"\x89PNG\r\n\x1a\n" or image[12:16]!=b"IHDR":
              raise SystemExit("iOS screenshot is missing, too small, or not a valid PNG")
          width,height=struct.unpack(">II",image[16:24])
          if width<320 or height<320:
              raise SystemExit(f"iOS screenshot dimensions too small: {width}x{height}")
          print(json.dumps({"platform":"ios-simulator","runtime":"PASS","screenshot":"PASS","width":width,"height":height,"bytes":len(image)}))
          PY
      - name: Upload iOS simulator regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eng-p23-ios-device-${{ github.run_id }}
          path: .artifacts/device-fixture/results/ios/
          if-no-files-found: warn
          retention-days: 30
