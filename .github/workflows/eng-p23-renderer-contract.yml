name: ENG-P23 Renderer Contract Checks

on:
  push:
    branches: [main]
    paths:
      - "apps/web/components/spatial/CanonicalWorldRenderer.tsx"
      - "apps/web/components/spatial/CanonicalGlbPreview.tsx"
      - "apps/client/components/spatial/CanonicalNativeWorldRenderer.tsx"
      - "apps/client/lib/spatial/configureAllphaGLTFLoader.ts"
      - "apps/web/lib/spatial/configureAllphaGLTFLoader.ts"
      - ".github/workflows/eng-p23-renderer-contract.yml"
  pull_request:
    paths:
      - "apps/web/components/spatial/CanonicalWorldRenderer.tsx"
      - "apps/web/components/spatial/CanonicalGlbPreview.tsx"
      - "apps/client/components/spatial/CanonicalNativeWorldRenderer.tsx"
      - "apps/client/lib/spatial/configureAllphaGLTFLoader.ts"
      - "apps/web/lib/spatial/configureAllphaGLTFLoader.ts"
      - ".github/workflows/eng-p23-renderer-contract.yml"

permissions:
  contents: read

concurrency:
  group: eng-p23-renderer-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        working-directory: apps/client
      - run: npm run typecheck
        working-directory: apps/client
      - run: npm test
        working-directory: apps/client
