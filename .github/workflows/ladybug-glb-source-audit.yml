name: Allpha Ladybug GLB Source Audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ladybug-glb-source-audit.yml"
  workflow_dispatch:
    inputs:
      max_assets:
        description: "Maximum unique GLB URLs to process"
        required: true
        default: "1200"
      max_bytes:
        description: "Maximum downloaded bytes"
        required: true
        default: "1000000000"
permissions:
  contents: read
concurrency:
  group: allpha-ladybug-glb-source-audit
  cancel-in-progress: false
jobs:
  acquire-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Acquire only ladybug-tools/3d-models
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REPO: ladybug-tools/3d-models
          MAX_ASSETS: ${{ inputs.max_assets || '1200' }}
          MAX_BYTES: ${{ inputs.max_bytes || '1000000000' }}
        run: python tools/3d-assets/acquire_glb_assets.py --source-repo ladybug-tools/3d-models --out ladybug-glb-audit
      - name: Upload filtered manifest and summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladybug-glb-audit-${{ github.run_number }}
          path: |
            ladybug-glb-audit/manifest.csv
            ladybug-glb-audit/summary.json
            ladybug-glb-audit/errors.json
          if-no-files-found: warn
          retention-days: 14
