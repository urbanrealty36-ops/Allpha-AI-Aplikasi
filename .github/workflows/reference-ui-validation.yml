name: Reference UI Validation

on:
  push:
    paths:
      - ".github/workflows/reference-ui-validation.yml"
      - "apps/web/app/**"
      - "apps/web/components/ReferenceAppShell.tsx"
      - "apps/web/components/reference-ui/**"
      - "apps/web/scripts/smoke-test.mjs"
      - "apps/web/scripts/visual-smoke.mjs"
      - "apps/web/app/globals.css"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run canonical smoke tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start Next.js server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/allpha-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/feed >/dev/null; then
              echo "Next.js server ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/allpha-next.log
          exit 1
      - name: Check routes at mobile and desktop viewports
        run: node scripts/visual-smoke.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allpha-reference-ui-visual-${{ github.sha }}
          path: apps/web/artifacts/reference-ui-visual/
          if-no-files-found: warn
          retention-days: 14
