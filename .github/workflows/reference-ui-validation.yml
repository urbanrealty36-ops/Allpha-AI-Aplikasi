name: Reference UI Validation

on:
  push:
    paths:
      - ".github/workflows/reference-ui-validation.yml"
      - "apps/web/app/**"
      - "apps/web/components/ReferenceAppShell.tsx"
      - "apps/web/components/reference-ui/**"
      - "apps/web/scripts/smoke-test.mjs"
      - "apps/web/scripts/visual-smoke.mjs"
      - "apps/web/scripts/visual-auth-smoke.mjs"
      - "apps/web/app/globals.css"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    env:
      AUTH_E2E_CONFIGURED: ${{ secrets.ALLPHA_E2E_EMAIL != '' && secrets.ALLPHA_E2E_PASSWORD != '' && secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY != '' && secrets.NEXT_PUBLIC_API_BASE_URL != '' }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run canonical smoke tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start Next.js server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/allpha-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/feed >/dev/null; then
              echo "Next.js server ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/allpha-next.log
          exit 1
      - name: Check routes at mobile and desktop viewports
        run: node scripts/visual-smoke.mjs
      - name: Capture authenticated visual evidence
        if: ${{ env.AUTH_E2E_CONFIGURED == 'true' }}
        run: node scripts/visual-auth-smoke.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          ALLPHA_E2E_EMAIL: ${{ secrets.ALLPHA_E2E_EMAIL }}
          ALLPHA_E2E_PASSWORD: ${{ secrets.ALLPHA_E2E_PASSWORD }}
      - name: Report missing authenticated test configuration
        if: ${{ env.AUTH_E2E_CONFIGURED != 'true' }}
        run: echo "::warning::Authenticated visual proof was not run because dedicated Supabase E2E credentials/configuration are not configured."
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allpha-reference-ui-visual-${{ github.sha }}
          path: |
            apps/web/artifacts/reference-ui-visual/
            apps/web/artifacts/reference-ui-authenticated/
          if-no-files-found: warn
          retention-days: 14
