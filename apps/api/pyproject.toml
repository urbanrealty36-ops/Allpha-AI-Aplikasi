[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allpha-api"
version = "0.1.0"
description = "Allpha platform API foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pypdf>=5.0,<7.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "Pillow>=11.0,<13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "requests>=2.31,<3.0",
]

[project.scripts]
allpha-knowledge-worker = "allpha_api.knowledge_worker:main"
allpha-workflow-worker = "allpha_api.workflow_worker_host:main"
allpha-notification-worker = "allpha_api.notification_worker:main"
allpha-agent-task-scheduler = "allpha_api.agent_task_schedule_worker:main"
allpha-social-graph-outbox-worker = "allpha_api.social_graph_outbox_worker:main"
allpha-content-media-worker = "allpha_api.content_media_worker:main"
allpha-content-transcode-worker = "allpha_api.content_transcode_worker:main"
allpha-content-scheduler = "allpha_api.content_scheduler_worker:main"
allpha-content-retention-worker = "allpha_api.content_retention_worker:main"
allpha-content-provider-cleanup = "allpha_api.content_provider_cleanup_worker:main"
allpha-content-provider-callback = "allpha_api.content_provider_callback_worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
allpha_api = ["agency_agents_catalog.json", "agency_skill_drafts/*.json", "agency_skill_reconciliation_candidates.json"]
