# Railway service configuration. Set the service Root Directory to /apps/api
# and Config-as-Code path to /apps/api/railway.toml in Railway.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
